<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="فلابي شات">
<meta name="theme-color" content="#16232d">
<title>فلابي شات</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  :root {
    --bg: #16232d; --card: #213443; --card2: #1a2b38; --line: #34505f;
    --accent: #f5a623; --teal: #4ec0ca; --green1: #35c27a; --green2: #1f8f55;
    --them: #3a5368; --text: #eef5f8; --muted: #9db3bf;
  }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
    font-family: 'Cairo', system-ui, -apple-system, 'Segoe UI', Tahoma, sans-serif; }
  body { display: flex; flex-direction: column; align-items: center; overflow-x: hidden; }
  #app { width: 100%; max-width: 420px; padding: 10px 12px 90px; display: flex; flex-direction: column; gap: 10px; }
  h1 { font-size: 20px; margin: 4px 0 0; text-align: center; font-weight: 700; }

  #stage { position: relative; width: 100%; aspect-ratio: 320 / 480; max-height: 58vh; margin: 0 auto;
    border-radius: 16px; overflow: hidden; touch-action: none; background: #4ec0ca;
    border: 3px solid var(--line); box-shadow: 0 8px 24px rgba(0,0,0,.35); }
  canvas { width: 100%; height: 100%; display: block; touch-action: none; direction: ltr; }

  #panel { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 12px;
    display: flex; flex-direction: column; gap: 8px; }
  .row { display: flex; gap: 8px; }
  input { flex: 1; min-width: 0; padding: 11px 12px; border-radius: 12px; border: 1px solid var(--line);
    font-size: 16px; font-family: inherit; background: var(--card2); color: var(--text); outline: none; }
  input:focus { border-color: var(--teal); }
  input::placeholder { color: var(--muted); }
  button { padding: 11px 16px; border-radius: 12px; border: 0; font-size: 15px; font-weight: 700;
    font-family: inherit; cursor: pointer; background: var(--accent); color: #231800; }
  button:active { transform: scale(.97); }
  button:disabled { opacity: .5; }
  button.ghost { background: transparent; color: var(--muted); border: 1px solid var(--line); font-weight: 600; padding: 7px 12px; font-size: 13px; }
  #status { font-size: 14px; text-align: center; background: var(--card2); border-radius: 12px; padding: 9px; line-height: 1.6; }
  #help { font-size: 12px; color: var(--muted); text-align: center; line-height: 1.6; }

  /* زر الشات العائم */
  #fab { position: fixed; bottom: 18px; inset-inline-end: 18px; width: 58px; height: 58px; border-radius: 50%;
    padding: 0; font-size: 26px; display: none; align-items: center; justify-content: center;
    background: linear-gradient(135deg, var(--teal), #2d9aa5); color: #fff; box-shadow: 0 6px 18px rgba(0,0,0,.45); z-index: 20; }
  #fab.show { display: flex; }
  #badge { position: absolute; top: -4px; inset-inline-start: -4px; background: #ff4d5e; color: #fff; font-size: 12px;
    min-width: 22px; height: 22px; border-radius: 11px; display: none; align-items: center; justify-content: center; padding: 0 5px; font-weight: 700; }
  #toast { position: fixed; bottom: 86px; inset-inline-end: 18px; max-width: 70vw; background: #fff; color: #17232b;
    padding: 9px 13px; border-radius: 14px; font-size: 14px; box-shadow: 0 6px 18px rgba(0,0,0,.35);
    opacity: 0; transform: translateY(8px); transition: .25s; pointer-events: none; z-index: 21; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #toast.show { opacity: 1; transform: none; }

  /* نافذة الشات */
  #sheet { position: fixed; left: 50%; bottom: 0; width: 100%; max-width: 420px; height: 58vh; z-index: 30;
    transform: translate(-50%, 110%); transition: transform .3s cubic-bezier(.2,.8,.2,1);
    background: var(--card); border: 2px solid var(--line); border-bottom: 0; border-radius: 22px 22px 0 0;
    display: flex; flex-direction: column; box-shadow: 0 -10px 30px rgba(0,0,0,.5); }
  #sheet.open { transform: translate(-50%, 0); }
  #sheetHead { display: flex; align-items: center; gap: 10px; padding: 12px 14px; border-bottom: 1px solid var(--line); }
  #dot { width: 11px; height: 11px; border-radius: 50%; background: #777; flex: none; }
  #dot.on { background: #35e08a; box-shadow: 0 0 8px #35e08a; }
  #sheetTitle { flex: 1; font-weight: 700; font-size: 16px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #closeBtn { width: 36px; height: 36px; padding: 0; border-radius: 50%; font-size: 18px; background: var(--card2); color: var(--text); border: 1px solid var(--line); }
  #log { flex: 1; overflow-y: auto; padding: 12px; display: flex; flex-direction: column; gap: 8px; background: var(--card2); }
  .bubble { max-width: 82%; padding: 8px 13px 6px; border-radius: 18px; line-height: 1.6; font-size: 15px;
    word-break: break-word; box-shadow: 0 2px 6px rgba(0,0,0,.25); }
  .bubble .txt { unicode-bidi: plaintext; display: block; white-space: pre-wrap; }
  .bubble .meta { display: flex; gap: 8px; font-size: 11px; opacity: .75; margin-top: 2px; justify-content: space-between; }
  .me { align-self: flex-start; background: linear-gradient(135deg, var(--green1), var(--green2)); border-top-right-radius: 5px; color: #fff; }
  .them { align-self: flex-end; background: var(--them); border-top-left-radius: 5px; }
  .sys { align-self: center; font-size: 12px; color: var(--muted); background: rgba(255,255,255,.06); padding: 3px 12px; border-radius: 12px; }
  #chatForm { display: flex; gap: 8px; padding: 10px 12px calc(10px + env(safe-area-inset-bottom)); border-top: 1px solid var(--line); }
  #sendBtn { width: 48px; padding: 0; font-size: 20px; background: linear-gradient(135deg, var(--teal), #2d9aa5); color: #fff; }
</style>
</head>
<body>
<div id="app">
  <h1>🐦 فلابي شات</h1>

  <div id="stage"><canvas id="c" width="320" height="480"></canvas></div>

  <div id="panel">
    <div id="setup">
      <div class="row"><input id="nameIn" placeholder="اسمك" maxlength="16"></div>
      <div class="row" style="margin-top:8px">
        <input id="codeIn" placeholder="كود الغرفة (4 أحرف أو أرقام فأكثر)" maxlength="20" autocomplete="off" autocapitalize="off">
      </div>
      <div class="row" style="margin-top:8px">
        <button id="enterBtn" style="flex:1">دخول الغرفة 🚪</button>
      </div>
      <div id="help">انتم الاثنين اكتبوا نفس الكود واضغطوا دخول. استخدموا كود صعب التخمين حتى ما يدخل عليكم أحد.</div>
    </div>
    <div id="status">غير متصل</div>
    <button id="leaveBtn" class="ghost" style="display:none">خروج من الغرفة</button>
  </div>
</div>

<button id="fab" aria-label="فتح الشات">💬<span id="badge">0</span></button>
<div id="toast"></div>

<div id="sheet" aria-hidden="true">
  <div id="sheetHead">
    <span id="dot"></span>
    <span id="sheetTitle">الشات</span>
    <button id="closeBtn" aria-label="إغلاق">✕</button>
  </div>
  <div id="log"></div>
  <form id="chatForm">
    <input id="msgIn" placeholder="اكتب رسالة..." autocomplete="off" maxlength="300">
    <button id="sendBtn" type="submit" aria-label="إرسال">➤</button>
  </form>
</div>

<script>
/* ================= اللعبة ================= */
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
const W = 320, H = 480, GROUND = 60;
const GAP = 135, PIPE_W = 52, PIPE_SPACE = 175, SPEED = 2;
const GRAVITY = 0.42, FLAP = -7.2;

let state = 'ready'; // ready | play | dead
let bird, pipes, score, best = 0, frames = 0, groundX = 0, deadTime = 0;
try { best = parseInt(localStorage.getItem('flappyBest') || '0', 10) || 0; } catch (e) {}

function reset() {
  bird = { x: 80, y: H / 2 - 20, vy: 0, r: 12, rot: 0 };
  pipes = []; score = 0; frames = 0;
  for (let i = 0; i < 3; i++) addPipe(W + 60 + i * PIPE_SPACE);
}
function addPipe(x) {
  const min = 70, max = H - GROUND - GAP - 70;
  pipes.push({ x, top: min + Math.random() * (max - min), passed: false });
}
function flap() {
  if (state === 'ready') state = 'play';
  if (state === 'play') bird.vy = FLAP;
  else if (state === 'dead' && deadTime > 25) { reset(); state = 'ready'; }
}
function die() {
  state = 'dead'; deadTime = 0;
  if (score > best) { best = score; try { localStorage.setItem('flappyBest', String(best)); } catch (e) {} }
  sendData({ type: 'score', score: score });
}

function update(dt) {
  groundX = (groundX - SPEED * dt) % 24;
  if (state === 'ready') { bird.y = H / 2 - 20 + Math.sin(frames / 10) * 6; frames += dt; return; }
  if (state === 'dead') {
    deadTime += dt;
    if (bird.y < H - GROUND - bird.r) { bird.vy += GRAVITY * dt; bird.y += bird.vy * dt; bird.rot = Math.min(bird.rot + 0.1 * dt, 1.5); }
    return;
  }
  frames += dt;
  bird.vy += GRAVITY * dt; bird.y += bird.vy * dt;
  bird.rot = Math.max(-0.5, Math.min(1.3, bird.vy / 9));
  for (const p of pipes) {
    p.x -= SPEED * dt;
    if (!p.passed && p.x + PIPE_W < bird.x) { p.passed = true; score++; }
  }
  if (pipes[0].x + PIPE_W < -5) { pipes.shift(); addPipe(pipes[pipes.length - 1].x + PIPE_SPACE); }
  if (bird.y + bird.r >= H - GROUND) { bird.y = H - GROUND - bird.r; die(); return; }
  if (bird.y - bird.r < -40) bird.y = -40 + bird.r;
  for (const p of pipes) {
    const inX = bird.x + bird.r - 2 > p.x && bird.x - bird.r + 2 < p.x + PIPE_W;
    if (inX && (bird.y - bird.r + 2 < p.top || bird.y + bird.r - 2 > p.top + GAP)) { die(); return; }
  }
}

function drawPipe(p) {
  ctx.fillStyle = '#73bf2e'; ctx.strokeStyle = '#33621a'; ctx.lineWidth = 2;
  ctx.fillRect(p.x, 0, PIPE_W, p.top); ctx.strokeRect(p.x, -2, PIPE_W, p.top + 2);
  ctx.fillRect(p.x - 3, p.top - 20, PIPE_W + 6, 20); ctx.strokeRect(p.x - 3, p.top - 20, PIPE_W + 6, 20);
  const by = p.top + GAP;
  ctx.fillRect(p.x, by, PIPE_W, H - GROUND - by); ctx.strokeRect(p.x, by, PIPE_W, H - GROUND - by);
  ctx.fillRect(p.x - 3, by, PIPE_W + 6, 20); ctx.strokeRect(p.x - 3, by, PIPE_W + 6, 20);
}
function drawBird() {
  ctx.save(); ctx.translate(bird.x, bird.y); ctx.rotate(bird.rot);
  ctx.fillStyle = '#f8d030'; ctx.beginPath(); ctx.ellipse(0, 0, 16, 12, 0, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = '#7a5a00'; ctx.lineWidth = 2; ctx.stroke();
  const wy = Math.sin(frames / 2) * 3;
  ctx.fillStyle = '#e8a800'; ctx.beginPath(); ctx.ellipse(-4, 2 + wy, 8, 5, 0, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(7, -4, 5, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#000'; ctx.beginPath(); ctx.arc(9, -4, 2, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#f06030'; ctx.beginPath(); ctx.moveTo(12, 0); ctx.lineTo(22, 3); ctx.lineTo(12, 7); ctx.closePath(); ctx.fill();
  ctx.restore();
}
function text(str, x, y, size, color) {
  ctx.font = 'bold ' + size + 'px Cairo, system-ui, Arial';
  ctx.textAlign = 'center'; ctx.lineWidth = 4; ctx.strokeStyle = '#222';
  ctx.strokeText(str, x, y); ctx.fillStyle = color || '#fff'; ctx.fillText(str, x, y);
}
function draw() {
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, '#4ec0ca'); g.addColorStop(1, '#bfe9ee');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = 'rgba(255,255,255,.55)';
  for (let i = 0; i < 3; i++) {
    const cx = ((i * 140 - frames * 0.3) % (W + 80) + W + 80) % (W + 80) - 40;
    ctx.beginPath(); ctx.arc(cx, 90 + i * 55, 20, 0, 7); ctx.arc(cx + 22, 96 + i * 55, 16, 0, 7); ctx.arc(cx - 20, 98 + i * 55, 14, 0, 7); ctx.fill();
  }
  pipes.forEach(drawPipe);
  ctx.fillStyle = '#ded895'; ctx.fillRect(0, H - GROUND, W, GROUND);
  ctx.fillStyle = '#73bf2e'; ctx.fillRect(0, H - GROUND, W, 12);
  ctx.fillStyle = '#5da024';
  for (let x = groundX - 24; x < W + 24; x += 24) ctx.fillRect(x, H - GROUND, 12, 12);
  drawBird();
  if (state !== 'ready') text(String(score), W / 2, 70, 44);
  if (state === 'ready') { text('اضغط للطيران', W / 2, 150, 28); text('Tap to flap', W / 2, 185, 18); }
  if (state === 'dead') {
    ctx.fillStyle = 'rgba(0,0,0,.35)'; ctx.fillRect(40, 150, W - 80, 150);
    text('خسرت!', W / 2, 195, 30, '#ff6b6b');
    text('النتيجة: ' + score, W / 2, 235, 22);
    text('الأفضل: ' + best, W / 2, 265, 22, '#ffd166');
    if (deadTime > 25) text('اضغط للإعادة', W / 2, 330, 20);
  }
}
let last = performance.now();
function loop(t) {
  const dt = Math.min((t - last) / 16.667, 2.5); last = t;
  update(dt); draw(); requestAnimationFrame(loop);
}
reset(); requestAnimationFrame(loop);

document.getElementById('stage').addEventListener('pointerdown', e => { e.preventDefault(); flap(); });
document.addEventListener('keydown', e => {
  const tag = (e.target.tagName || '').toLowerCase();
  if (tag === 'input' || tag === 'textarea') return;
  if (e.code === 'Space' || e.code === 'ArrowUp') { e.preventDefault(); flap(); }
});

/* ================= الشات (عبر خادم ntfy.sh العام) ================= */
const $ = id => document.getElementById(id);
const NTFY = 'https://ntfy.sh/';
const logEl = $('log');
const myId = Math.random().toString(36).slice(2, 10);
let topic = null, es = null, joined = false, friend = null;
let myName = '', connTimer = null, hbTimer = null, watchTimer = null;
let chatOpen = false, unread = 0, toastTimer = null;

try {
  $('nameIn').value = localStorage.getItem('flappyName') || '';
  $('codeIn').value = localStorage.getItem('flappyCode') || '';
} catch (e) {}

function setStatus(s) { $('status').textContent = s; }
function lockSetup(v) { ['enterBtn', 'codeIn', 'nameIn'].forEach(i => $(i).disabled = v); }
function timeNow() {
  const d = new Date();
  return String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0');
}

function openChat() {
  chatOpen = true; unread = 0; updateBadge();
  $('sheet').classList.add('open'); $('sheet').setAttribute('aria-hidden', 'false');
  logEl.scrollTop = logEl.scrollHeight;
}
function closeChat() {
  chatOpen = false;
  $('sheet').classList.remove('open'); $('sheet').setAttribute('aria-hidden', 'true');
  if (document.activeElement) document.activeElement.blur();
}
function updateBadge() {
  const b = $('badge');
  b.textContent = unread > 99 ? '99+' : String(unread);
  b.style.display = unread > 0 ? 'flex' : 'none';
}
function showToast(str) {
  const t = $('toast'); t.textContent = str; t.classList.add('show');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('show'), 3500);
}
$('fab').onclick = () => chatOpen ? closeChat() : openChat();
$('closeBtn').onclick = closeChat;

function addMsg(str, cls, who) {
  const d = document.createElement('div');
  if (cls === 'sys') {
    d.className = 'sys'; d.textContent = str;
  } else {
    d.className = 'bubble ' + cls;
    const t = document.createElement('span'); t.className = 'txt'; t.textContent = str; d.appendChild(t);
    const m = document.createElement('span'); m.className = 'meta';
    const n = document.createElement('span'); n.textContent = who || '';
    const tm = document.createElement('span'); tm.textContent = timeNow();
    m.appendChild(n); m.appendChild(tm); d.appendChild(m);
  }
  logEl.appendChild(d);
  logEl.scrollTop = logEl.scrollHeight;
  if (cls === 'them' && !chatOpen) {
    unread++; updateBadge(); showToast((who || 'صديقك') + ': ' + str);
  }
}

/* إرسال */
function post(obj) {
  if (!topic) return Promise.resolve();
  obj.id = myId;
  return fetch(NTFY + topic, { method: 'POST', body: JSON.stringify(obj) }).catch(() => {});
}
function sendData(obj) { if (joined) post(obj); }

/* حالة الصديق */
function friendOnline(name) {
  $('dot').classList.add('on');
  $('sheetTitle').textContent = '💬 ' + name;
  setStatus('✅ متصل مع ' + name + ' — اضغط زر 💬 للشات');
}
function friendOffline() {
  $('dot').classList.remove('on');
  $('sheetTitle').textContent = 'بانتظار صديقك...';
  setStatus('⏳ بانتظار صديقك. خليه يدخل نفس الكود');
}

/* استقبال */
function handle(m) {
  const now = Date.now();
  if (!friend || now - friend.seen > 30000) {
    friend = { id: m.id, name: String(m.name || 'صديقك').slice(0, 16), seen: now };
    friendOnline(friend.name);
    addMsg(friend.name + ' دخل الغرفة 🎮', 'sys');
    post({ type: 'hello', name: myName });
  } else if (friend.id !== m.id) {
    return; // الغرفة لشخصين فقط
  }
  friend.seen = now;
  if (m.type === 'hello' && m.name) {
    const nm = String(m.name).slice(0, 16);
    if (nm !== friend.name) { friend.name = nm; friendOnline(nm); }
  } else if (m.type === 'chat') {
    addMsg(String(m.text || '').slice(0, 300), 'them', friend.name);
  } else if (m.type === 'score') {
    addMsg(friend.name + ' لعب وجاب ' + (parseInt(m.score, 10) || 0) + ' 🐦', 'sys');
  } else if (m.type === 'bye') {
    addMsg(friend.name + ' طلع من الغرفة', 'sys');
    friend = null; friendOffline();
  }
}

function cleanup() {
  clearTimeout(connTimer); clearInterval(hbTimer); clearInterval(watchTimer);
  if (es) { es.close(); es = null; }
  joined = false; friend = null; topic = null;
  lockSetup(false);
}

function enterRoom() {
  myName = ($('nameIn').value.trim() || 'لاعب').slice(0, 16);
  const code = $('codeIn').value.trim().toLowerCase().replace(/[^a-z0-9]/g, '');
  try { localStorage.setItem('flappyName', myName); localStorage.setItem('flappyCode', code); } catch (e) {}
  if (code.length < 4) { setStatus('⚠️ اكتب كود من 4 أحرف أو أرقام على الأقل (أصعب أحسن)'); return; }
  topic = 'flappychat-' + code;
  lockSetup(true);
  setStatus('⏳ جاري الدخول...');
  connTimer = setTimeout(() => {
    if (!joined) { setStatus('❌ ما قدرت أتصل بخادم الشات. تأكد من الإنترنت وجرب مرة ثانية'); cleanup(); }
  }, 15000);

  es = new EventSource(NTFY + topic + '/sse');
  es.onopen = () => {
    if (joined) { post({ type: 'hello', name: myName }); return; }
    joined = true; clearTimeout(connTimer);
    $('setup').style.display = 'none';
    $('leaveBtn').style.display = 'block';
    $('fab').classList.add('show');
    friendOffline();
    addMsg('دخلت الغرفة. بانتظار صديقك...', 'sys');
    post({ type: 'hello', name: myName });
    hbTimer = setInterval(() => post({ type: 'hello', name: myName }), 10000);
    watchTimer = setInterval(() => {
      if (friend && Date.now() - friend.seen > 30000) {
        addMsg(friend.name + ' انقطع اتصاله', 'sys');
        friend = null; friendOffline();
      }
    }, 5000);
  };
  es.onerror = () => { if (joined) setStatus('🔄 جاري إعادة الاتصال بالخادم...'); };
  es.onmessage = ev => {
    let m;
    try {
      const env = JSON.parse(ev.data);
      if (env.event !== 'message') return;
      m = JSON.parse(env.message);
    } catch (e) { return; }
    if (!m || typeof m !== 'object' || m.id === myId) return;
    handle(m);
  };
}
$('enterBtn').onclick = enterRoom;
$('codeIn').addEventListener('keydown', e => { if (e.key === 'Enter') enterRoom(); });

function leaveRoom() {
  if (joined) post({ type: 'bye' });
  closeChat(); cleanup();
  $('fab').classList.remove('show');
  $('leaveBtn').style.display = 'none';
  $('setup').style.display = 'block';
  logEl.innerHTML = ''; unread = 0; updateBadge();
  setStatus('غير متصل');
}
$('leaveBtn').onclick = leaveRoom;
window.addEventListener('pagehide', () => {
  if (joined && topic) { try { navigator.sendBeacon(NTFY + topic, JSON.stringify({ type: 'bye', id: myId })); } catch (e) {} }
});

$('chatForm').addEventListener('submit', e => {
  e.preventDefault();
  const v = $('msgIn').value.trim();
  if (!v || !joined) return;
  post({ type: 'chat', text: v, name: myName });
  addMsg(v, 'me', 'أنت');
  if (!friend) addMsg('صديقك مو موجود حالياً، رسالتك ما راح توصله', 'sys');
  $('msgIn').value = '';
});
</script>
</body>
</html>
