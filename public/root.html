<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>منتظر روت</title>
<meta name="theme-color" content="#0d2f2e">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lalezar&family=Rubik:wght@400;500;700&display=swap">
<style>
:root { --bg: #0d2f2e; --ink: #24140e; --pick: #ffd23f; --red: #e8344a; --paper: #f7f3e8; --leather: #6b3a1e; --leather2: #4a2412; --txt: #eaf6f2; --mut: #9cc7bf;
  --display: 'Lalezar', 'Rubik', system-ui, sans-serif; --body: 'Rubik', system-ui, sans-serif; color-scheme: dark }
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--txt); font-family: var(--body); overflow: hidden; touch-action: none; user-select: none; -webkit-user-select: none }
canvas#g { position: fixed; inset: 0; width: 100%; height: 100%; display: block }
button { font-family: var(--body); cursor: pointer }
[hidden] { display: none !important }

/* ---- الدخول ---- */
#auth { position: fixed; inset: 0; z-index: 50; display: grid; place-items: center; padding: 20px max(16px, env(safe-area-inset-right)) 20px max(16px, env(safe-area-inset-left));
  background: radial-gradient(circle at 30% 10%, #17504c, var(--bg) 60%); overflow: auto; touch-action: auto }
#auth .box { width: 100%; max-width: 380px; background: var(--paper); color: var(--ink); border-radius: 24px; padding: 22px 20px; box-shadow: 0 0 0 5px #fff, 0 12px 0 5px rgba(0,0,0,.3) }
#auth h1 { font-family: var(--display); font-weight: 400; font-size: 46px; margin: 0; text-align: center; color: var(--red); text-shadow: 3px 3px 0 var(--pick) }
#auth p.s { text-align: center; margin: 4px 0 16px; color: #6b5a4c; font-size: 14px }
#auth .tabs { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-bottom: 14px }
#auth .tabs button { border: 2px solid var(--ink); background: transparent; border-radius: 12px; padding: 9px; font-weight: 700; color: var(--ink) }
#auth .tabs button.on { background: var(--ink); color: var(--paper) }
#auth label { display: block; font-size: 13px; font-weight: 700; margin: 10px 0 4px }
#auth input { width: 100%; font: 500 16px var(--body); padding: 12px; border-radius: 12px; border: 2px solid #cfc4ad; background: #fff; color: var(--ink); direction: rtl }
#auth input:focus { outline: none; border-color: var(--ink) }
#auth .go { width: 100%; margin-top: 16px; padding: 13px; border: 0; border-radius: 14px; background: var(--red); color: #fff; font: 400 24px var(--display); box-shadow: 0 5px 0 #8a1424 }
#auth .err { color: var(--red); font-size: 13px; font-weight: 700; min-height: 1.4em; margin-top: 8px; text-align: center }
#auth .note { font-size: 12px; color: #6b5a4c; text-align: center; margin-top: 10px; line-height: 1.6 }

/* ---- الواجهة ---- */
#hud { position: fixed; top: 0; left: 0; right: 0; z-index: 5; display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; pointer-events: none;
  padding: calc(8px + env(safe-area-inset-top)) max(10px, env(safe-area-inset-right)) 0 max(10px, env(safe-area-inset-left)) }
.pill { pointer-events: auto; background: rgba(8,25,24,.82); border: 2px solid rgba(255,255,255,.14); border-radius: 16px; padding: 6px 12px; display: flex; flex-direction: column; gap: 1px; backdrop-filter: blur(6px) }
.pill b { font: 400 22px var(--display); color: var(--pick); line-height: 1.1; font-variant-numeric: tabular-nums; direction: ltr; text-align: right }
.pill small { font-size: 11px; color: var(--mut) }
#hudR { display: flex; gap: 8px; align-items: flex-start }
.icb { pointer-events: auto; width: 54px; height: 54px; border-radius: 16px; border: 3px solid var(--ink); font-size: 26px; display: grid; place-items: center; box-shadow: 0 4px 0 rgba(0,0,0,.4) }
#bookBtn { background: linear-gradient(160deg, #8a4a24, var(--leather2)); color: var(--pick) }
#exitBtn { background: #1b3a39; color: #fff; width: 44px; height: 44px; font-size: 18px; border-color: rgba(255,255,255,.2) }
#lockInfo { margin-top: 4px }
#toasts { position: fixed; top: calc(76px + env(safe-area-inset-top)); left: 50%; transform: translateX(-50%); z-index: 6; display: flex; flex-direction: column; gap: 6px; align-items: center; pointer-events: none; width: min(92vw, 420px) }
.toast { background: rgba(8,25,24,.92); border: 2px solid var(--pick); color: #fff; border-radius: 14px; padding: 7px 14px; font-size: 14px; font-weight: 500; text-align: center; animation: tIn .2s ease-out }
.toast.alarm { border-color: var(--red); background: rgba(90,10,20,.95); font-weight: 700 }
@keyframes tIn { from { transform: translateY(-8px); opacity: 0 } }
#acts { position: fixed; z-index: 5; right: max(14px, env(safe-area-inset-right)); bottom: calc(18px + env(safe-area-inset-bottom)); display: flex; flex-direction: column-reverse; gap: 10px; align-items: flex-end; max-width: 56vw }
.act { border: 3px solid var(--ink); border-radius: 18px; padding: 10px 16px; font: 400 19px var(--display); color: var(--ink); background: var(--pick); box-shadow: 0 5px 0 rgba(0,0,0,.45); text-align: center; line-height: 1.15; min-width: 120px }
.act small { display: block; font: 700 12px var(--body); opacity: .8 }
.act.red { background: var(--red); color: #fff } .act.blue { background: #3fa7ff } .act.green { background: #3ddc84 } .act.dim { background: #c9d6d4 }
.act:active { transform: translateY(3px); box-shadow: 0 2px 0 rgba(0,0,0,.45) }
#lookHint { position: fixed; z-index: 4; left: 50%; transform: translateX(-50%); bottom: calc(170px + env(safe-area-inset-bottom)); background: rgba(8,25,24,.75); color: #fff; padding: 6px 12px; border-radius: 12px; font-size: 13px; pointer-events: none; animation: hintOut 1s 6s forwards }
@keyframes hintOut { to { opacity: 0 } }
#joy { position: fixed; z-index: 5; left: max(18px, env(safe-area-inset-left)); bottom: calc(24px + env(safe-area-inset-bottom)); width: 136px; height: 136px; border-radius: 50%;
  background: radial-gradient(circle, rgba(255,255,255,.08), rgba(255,255,255,.16)); border: 3px solid rgba(255,255,255,.3) }
#knob { position: absolute; left: 50%; top: 50%; width: 60px; height: 60px; margin: -30px 0 0 -30px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #fff6c8, var(--pick)); border: 3px solid var(--ink); box-shadow: 0 4px 0 rgba(0,0,0,.35) }
#placeBar { position: fixed; z-index: 7; left: 50%; transform: translateX(-50%); top: calc(76px + env(safe-area-inset-top)); background: var(--pick); color: var(--ink); border: 3px solid var(--ink); border-radius: 16px; padding: 8px 12px; display: flex; gap: 10px; align-items: center; font-weight: 700; font-size: 14px; max-width: 92vw }
#placeBar { flex-wrap: wrap; justify-content: center }
#placeBar button { border: 2px solid var(--ink); border-radius: 10px; background: #fff; color: var(--ink); padding: 5px 10px; font-weight: 700 }
#placeNums { display: flex; gap: 4px; flex-wrap: wrap }
#placeNums button { background: #7dffb0; min-width: 34px }

/* ---- الكتاب ---- */
.ov { position: fixed; inset: 0; z-index: 20; background: rgba(4,14,13,.72); display: grid; place-items: center; padding: calc(12px + env(safe-area-inset-top)) max(10px, env(safe-area-inset-right)) calc(12px + env(safe-area-inset-bottom)) max(10px, env(safe-area-inset-left)); touch-action: auto }
.book { position: relative; width: min(100%, 760px); max-height: 100%; display: flex; flex-direction: column; background: linear-gradient(160deg, #8a4a24, var(--leather) 40%, var(--leather2)); border-radius: 18px 26px 26px 18px; padding: 14px; box-shadow: 0 0 0 3px var(--ink), 0 16px 40px rgba(0,0,0,.6); animation: bookIn .25s ease-out }
@keyframes bookIn { from { transform: rotateY(-25deg) scale(.92); opacity: 0 } }
.book::before { content: ""; position: absolute; inset: 8px; border: 2px dashed rgba(255,210,63,.35); border-radius: 14px 20px 20px 14px; pointer-events: none }
.book .top { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 0 6px 10px; position: relative }
.book .top h2 { font: 400 28px var(--display); color: var(--pick); margin: 0; text-shadow: 2px 2px 0 var(--ink) }
.book .x { border: 2px solid var(--ink); background: var(--pick); color: var(--ink); border-radius: 12px; width: 40px; height: 40px; font-size: 18px; font-weight: 700 }
.book .tabsB { display: flex; gap: 4px; flex-wrap: wrap; padding: 0 6px; position: relative }
.book .tabsB button { border: 2px solid var(--ink); border-bottom: 0; border-radius: 12px 12px 0 0; padding: 7px 12px; background: #d9c9a6; color: var(--ink); font-weight: 700; font-size: 13px }
.book .tabsB button.on { background: var(--paper) }
.pages { position: relative; flex: 1; min-height: 0; display: grid; grid-template-columns: 1fr 1fr; background: var(--paper); color: var(--ink); border-radius: 6px 10px 10px 6px; border: 2px solid var(--ink); overflow: hidden }
.pages::after { content: ""; position: absolute; top: 0; bottom: 0; left: 50%; width: 24px; margin-left: -12px; background: linear-gradient(90deg, rgba(0,0,0,0), rgba(0,0,0,.16), rgba(0,0,0,0)); pointer-events: none }
.page { padding: 14px; overflow: auto; min-height: 0; max-height: min(64vh, 520px) }
.page h3 { font: 400 22px var(--display); margin: 0 0 8px }
.page .muted { color: #6b5a4c; font-size: 13px; line-height: 1.6 }
.items { display: grid; grid-template-columns: repeat(auto-fill, minmax(78px, 1fr)); gap: 8px }
.it { position: relative; border: 2px solid #cfc4ad; border-radius: 14px; background: #fff; padding: 4px 2px 6px; text-align: center; font-size: 11px; font-weight: 700; color: var(--ink) }
.it canvas { width: 100%; aspect-ratio: 1; display: block }
.it.sel { border-color: var(--ink); box-shadow: 0 0 0 3px var(--pick) }
.it .m { position: absolute; top: 3px; right: 4px; font-size: 13px }
.det { display: flex; flex-direction: column; align-items: center; gap: 6px; text-align: center }
.det canvas { width: 170px; height: 170px }
.det h4 { font: 400 26px var(--display); margin: 0 }
.det .row { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; margin-top: 6px }
.btn { border: 3px solid var(--ink); border-radius: 14px; padding: 9px 14px; font: 400 18px var(--display); background: var(--pick); color: var(--ink); box-shadow: 0 4px 0 rgba(0,0,0,.35) }
.btn.red { background: var(--red); color: #fff } .btn.green { background: #3ddc84 } .btn.blue { background: #3fa7ff } .btn:disabled { opacity: .45 }
.chip { display: inline-block; font-size: 11px; font-weight: 700; padding: 3px 9px; border-radius: 99px; color: var(--ink) }
.r-common { background: #c9d6d4 } .r-rare { background: #6cc4ff } .r-epic { background: #c79bff } .r-leg { background: #ffc24a } .r-myth { background: #ff7a8f } .r-secret { background: linear-gradient(90deg, #ff7a8f, #ffc24a, #7dffb0, #6cc4ff, #c79bff) }
.mutp { display: flex; gap: 4px; flex-wrap: wrap; justify-content: center }
.mutp button { border: 2px solid var(--ink); border-radius: 10px; background: #fff; color: var(--ink); padding: 4px 8px; font-weight: 700; font-size: 12px }
.mutp button.on { background: var(--ink); color: var(--paper) }
.stat { display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; font-size: 14px; text-align: right; width: 100% }
.stat b { font-variant-numeric: tabular-nums }
@media (max-width: 620px) { .pages { grid-template-columns: 1fr } .pages::after { display: none } .page + .page { border-top: 2px dashed #cfc4ad } .page { max-height: none } .pages { overflow: auto; max-height: 70vh } }

/* ---- معركة ---- */
#fightOv .arena { width: min(100%, 560px); background: linear-gradient(#2a1048, #120626); border: 3px solid var(--pick); border-radius: 22px; padding: 14px; text-align: center; box-shadow: 0 16px 40px rgba(0,0,0,.6) }
.teams { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 6px }
.team { display: flex; flex-direction: column; gap: 6px }
.fu { position: relative; background: rgba(255,255,255,.07); border-radius: 12px; padding: 4px }
.fu canvas { width: 72px; height: 72px }
.fu .hp { height: 7px; background: rgba(255,255,255,.15); border-radius: 4px; overflow: hidden } .fu .hp i { display: block; height: 100%; background: #3ddc84; transition: width .25s }
.fu.hit { animation: shake .3s } .fu.dead { opacity: .3; filter: grayscale(1) }
.fu .dmg { position: absolute; top: 10px; left: 50%; transform: translateX(-50%); font: 400 24px var(--display); color: #ff4f5e; text-shadow: 2px 2px 0 #000; animation: up .7s forwards }
.fu .dmg.crit { color: var(--pick); font-size: 30px }
@keyframes shake { 30% { transform: translateX(-6px) } 60% { transform: translateX(6px) } }
@keyframes up { to { transform: translate(-50%, -30px); opacity: 0 } }
.vs { font: 400 34px var(--display); color: var(--pick) }
#fightRes { font: 400 30px var(--display); margin-top: 10px; min-height: 1.3em }
</style>
</head>
<body>
<canvas id="g"></canvas>

<div id="auth">
  <div class="box">
    <h1>منتظر روت</h1>
    <p class="s">برينروت أونلاين — 7 لاعبين، كل واحد إله قاعدة</p>
    <div class="tabs"><button type="button" id="tabIn" class="on">تسجيل دخول</button><button type="button" id="tabUp">حساب جديد</button></div>
    <form id="authF" autocomplete="on">
      <label for="aU">الاسم</label><input id="aU" name="username" autocomplete="username" maxlength="20" required>
      <label for="aP">الرمز</label><input id="aP" name="password" type="password" autocomplete="current-password" maxlength="64" required>
      <div id="p2w" hidden><label for="aP2">أعد الرمز</label><input id="aP2" type="password" autocomplete="new-password" maxlength="64"></div>
      <button class="go" type="submit" id="aGo">ادخل اللعبة</button>
      <div class="err" id="aErr" aria-live="polite"></div>
    </form>
    <p class="note">حسابك ورمزك ينحفظون بقاعدة البيانات، وبرينروتاتك وفلوسك وقاعدتك تبقى محفوظة وترجعلك كل ما تدخل.<br>نفس حساب بابيتو شات يشتغل هنا.</p>
  </div>
</div>

<div id="hud" hidden>
  <div class="pill"><b id="coins">0</b><small id="incs">+0 / ثانية</small></div>
  <div id="hudR">
    <div class="pill" id="lockInfo"><small id="lvTxt">قاعدتك مستوى 1</small><small id="lockTxt">الباب مفتوح</small></div>
    <button type="button" class="icb" id="bookBtn" aria-label="الكتاب">📖</button>
    <button type="button" class="icb" id="exitBtn" aria-label="خروج">⏻</button>
  </div>
</div>
<div id="toasts"></div>
<div id="joy" hidden><div id="knob"></div></div>
<div id="lookHint" hidden>👆 اسحب بالشاشة حتى تلف الكاميرا</div>
<div id="acts" hidden></div>
<div id="placeBar" hidden><span id="placeTxt">دوس على منصة فاضية بقاعدتك</span><span id="placeNums"></span><button type="button" id="placeX">إلغاء</button></div>

<div class="ov" id="bookOv" hidden>
  <div class="book" role="dialog" aria-label="الكتاب">
    <div class="top"><h2 id="bookT">📖 كتابي</h2><button type="button" class="x" id="bookX" aria-label="سد">✕</button></div>
    <div class="tabsB" id="bookTabs"></div>
    <div class="pages"><div class="page" id="pgL"></div><div class="page" id="pgR"></div></div>
  </div>
</div>
<div class="ov" id="fightOv" hidden>
  <div class="arena"><div class="teams"><div class="team" id="tA"></div><div class="vs">ضد</div><div class="team" id="tE"></div></div><div id="fightRes"></div><button type="button" class="btn" id="fightX" hidden>تمام</button></div>
</div>

<script src="/vendor/three-r128.min.js"></script>
<script src="/root-chars.js?v=1"></script>
<script>
'use strict';
const $ = id => document.getElementById(id);
const RN = { common: 'عادي', rare: 'نادر', epic: 'ملحمي', leg: 'أسطوري', myth: 'خرافي', secret: 'سري' };
const RC = { common: '#c9d6d4', rare: '#6cc4ff', epic: '#c79bff', leg: '#ffc24a', myth: '#ff7a8f', secret: '#ffffff' };
const MN = ['', 'ذهبي', 'ألماس', 'قوس قزح'], MI = ['', '🥇', '💎', '🌈'];
const EGN = { e1: ['بيضة عادية', '#f3ead6'], e2: ['بيضة ذهبية', '#ffd23f'], e3: ['بيضة كونية', '#8a5cff'] };
const fmt = n => { n = Math.floor(n); return n >= 1e15 ? '∞' : n >= 1e12 ? (n / 1e12).toFixed(1) + 'T' : n >= 1e9 ? (n / 1e9).toFixed(1) + 'B' : n >= 1e6 ? (n / 1e6).toFixed(1) + 'M' : n >= 1e4 ? (n / 1e3).toFixed(1) + 'K' : String(n); };
const CH = window.BR_CHARS || {};
const nameOf = id => (CH[id] && CH[id].n) || id;
function drawChar(c, id, x, y, s, t, m) {   // القدم عند (x,y)
  const ch = CH[id]; if (!ch) return; c.save();
  if (m) { const col = m === 1 ? 'rgba(255,210,63,' : m === 2 ? 'rgba(120,220,255,' : 'hsla(' + ((t * 120) % 360) + ',90%,65%,'; const g = c.createRadialGradient(x, y - 90 * s, 10 * s, x, y - 90 * s, 110 * s); g.addColorStop(0, col + '.55)'); g.addColorStop(1, col + '0)'); c.fillStyle = g; c.fillRect(x - 120 * s, y - 210 * s, 240 * s, 230 * s); }
  c.translate(x - 100 * s, y - 186 * s); c.scale(s, s); try { ch.draw(c, t); } catch (e) {} c.restore();
}
function charCanvas(cv, id, m, t) { const c = cv.getContext('2d'); cv.width = 240; cv.height = 240; c.setTransform(1.2, 0, 0, 1.2, 0, 0); c.clearRect(0, 0, 200, 200); if (m) { c.fillStyle = m === 1 ? 'rgba(255,210,63,.25)' : m === 2 ? 'rgba(120,220,255,.25)' : 'rgba(200,120,255,.25)'; c.beginPath(); c.arc(100, 105, 90, 0, 7); c.fill(); } try { CH[id].draw(c, t || 1); } catch (e) {} }

/* ===================== الصوت ===================== */
let AC = null; const snd = (f, f2, d, type, v) => { try { AC = AC || new (window.AudioContext || window.webkitAudioContext)(); if (AC.state === 'suspended') AC.resume(); const o = AC.createOscillator(), g = AC.createGain(), t = AC.currentTime; o.type = type || 'sine'; o.frequency.setValueAtTime(f, t); o.frequency.exponentialRampToValueAtTime(f2 || f, t + d); g.gain.setValueAtTime(v || .12, t); g.gain.exponentialRampToValueAtTime(.0001, t + d); o.connect(g); g.connect(AC.destination); o.start(t); o.stop(t + d); } catch (e) {} };
const SFX = { buy: () => { snd(660, 990, .12); setTimeout(() => snd(990, 1320, .15), 90); }, cash: () => snd(1400, 1800, .08, 'triangle', .08), steal: () => { snd(300, 900, .25, 'square', .07); }, alarm: () => { snd(880, 440, .3, 'sawtooth', .08); setTimeout(() => snd(880, 440, .3, 'sawtooth', .08), 320); }, lock: () => snd(220, 120, .3, 'square', .1), hatch: () => { snd(500, 1500, .4, 'triangle'); }, hit: () => snd(200, 80, .12, 'square', .1), up: () => { [523, 659, 784, 1047].forEach((f, i) => setTimeout(() => snd(f, f, .12, 'triangle'), i * 90)); } };

/* ===================== الحساب ===================== */
let auth = null; try { auth = JSON.parse(localStorage.getItem('flappyAuth') || 'null'); } catch (e) {}
let mode = 'in';
$('tabIn').onclick = () => { mode = 'in'; $('tabIn').classList.add('on'); $('tabUp').classList.remove('on'); $('p2w').hidden = true; $('aGo').textContent = 'ادخل اللعبة'; $('aErr').textContent = ''; $('aP').autocomplete = 'current-password'; };
$('tabUp').onclick = () => { mode = 'up'; $('tabUp').classList.add('on'); $('tabIn').classList.remove('on'); $('p2w').hidden = false; $('aGo').textContent = 'سوّي حسابي'; $('aErr').textContent = ''; $('aP').autocomplete = 'new-password'; };
['aU', 'aP', 'aP2'].forEach(id => $(id).addEventListener('input', () => { $('aErr').textContent = ''; }));
$('authF').addEventListener('submit', async e => {
  e.preventDefault(); const u = $('aU').value.trim(), p = $('aP').value, p2 = $('aP2').value;
  if (!u) { $('aErr').textContent = 'اكتب اسمك'; return; } if (!p) { $('aErr').textContent = 'اكتب الرمز'; return; }
  if (mode === 'up' && p !== p2) { $('aErr').textContent = 'الرمز وتأكيده مو نفس الشي'; return; }
  $('aGo').disabled = true;
  try {
    const r = await fetch(mode === 'up' ? '/api/register' : '/api/login', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(mode === 'up' ? { u, p, p2 } : { u, p }) });
    const j = await r.json(); if (!r.ok || !j.token) throw new Error(j.error || 'صار خطأ، جرب مرة ثانية');
    auth = { token: j.token, name: (j.user && j.user.name) || u }; try { localStorage.setItem('flappyAuth', JSON.stringify(auth)); } catch (e2) {}
    start();
  } catch (er) { $('aErr').textContent = er.message; } finally { $('aGo').disabled = false; }
});
$('exitBtn').onclick = () => { try { ws && ws.send(JSON.stringify({ t: 'br_leave' })); } catch (e) {} try { localStorage.removeItem('flappyAuth'); } catch (e) {} location.reload(); };

/* ===================== الاتصال ===================== */
let ws = null, G = null, S = null, ME = null, retry = 0;
function start() {
  $('auth').hidden = true; $('hud').hidden = false; $('joy').hidden = false; $('acts').hidden = false; $('lookHint').hidden = false;

setInterval(() => { let x = jx, y = jy; if (keys.a || keys.arrowleft) x = -1; if (keys.d || keys.arrowright) x = 1; if (keys.w || keys.arrowup) y = -1; if (keys.s || keys.arrowdown) y = 1; if (placing || !$('bookOv').hidden || !$('fightOv').hidden) { x = 0; y = 0; } { const f = -y, wx = Math.cos(camYaw) * x - Math.sin(camYaw) * f, wz = -Math.sin(camYaw) * x - Math.cos(camYaw) * f; x = wx; y = wz; } const k = x.toFixed(2) + ',' + y.toFixed(2); if (k !== lastIn) { lastIn = k; send({ t: 'br_in', x, y }); } }, 66);

/* ===================== أزرار القرب ===================== */
let actKey = '';

const inR = (x, y, g) => x > g.x && x < g.x + g.w && y > g.y && y < g.y + g.h;

  if (!ME || !G) return; const x = ME[2], y = ME[3], L = [], myG = G.geo[G.base], myB = S.bs[G.base] || {};

    let best = null, bd = 110; (S.cp || []).forEach(it => { const d0 = dd(x, y, it[3], it[4]); if (d0 < bd) { bd = d0; best = it; } });
    if (best) { const cd = G.cd[best[1]]; L.push(['buy' + best[0], 'اشتري ' + nameOf(best[1]) + (best[2] ? ' ' + MI[best[2]] : ''), '💰 ' + fmt(cd.p * G.mut[best[2] || 0]), '', () => send({ t: 'br_buy', u: best[0] })]); }
    G.geo.forEach(g => { if (g.i === G.base || !inR(x, y, g)) return; const b = S.bs[g.i]; if (!b || !b.o) return; g.ped.forEach(([px, py], si) => { const s = b.s[si]; if (s && !s[2] && !s[4] && dd(x, y, px, py) < 80) L.push(['st' + g.i + '_' + si, b.lk > 0 ? '🔒 مقفولة' : '🦹 اسرق ' + nameOf(s[0]), b.lk > 0 ? 'استنى ' + Math.ceil(b.lk / 1000) + 'ث' : '', 'red', () => send({ t: 'br_steal', b: g.i, s: si })]); }); });
  }
  if (inR(x, y, myG)) myG.ped.forEach(([px, py], si) => { const s = (myB.s || [])[si]; if (s && !s[2] && !s[4] && dd(x, y, px, py) < 70) { L.push(['pk' + si, '🎒 شيل للحقيبة', nameOf(s[0]), 'blue', () => send({ t: 'br_pick', s: si })]); if (!S.adm) L.push(['sl' + si, '💰 بيع', '+' + fmt(G.cd[s[0]].p * G.mut[s[1] || 0] * .5), 'dim', () => send({ t: 'br_sell', s: si })]); } });
  if (dd(x, y, myG.lock[0], myG.lock[1]) < 70) { L.push(['lk' + (myB.lk > 0), myB.lk > 0 ? '🔒 مقفول ' + Math.ceil(myB.lk / 1000) + 'ث' : '🔒 سد الباب', S.ls + ' ثانية', 'blue', () => send({ t: 'br_lock' })]); if (S.uc) L.push(['up' + S.lv, '⬆️ طوّر القاعدة', 'مستوى ' + (S.lv + 1) + ' • 💰 ' + fmt(S.uc), 'green', () => send({ t: 'br_up' })]); }
  const H = G.hub; if (dd(x, y, H.egg.x, H.egg.y) < 140) L.push(['egg', '🥚 محل البيض', '', '', () => openBook('eggs')]);
  if (dd(x, y, H.merge.x, H.merge.y) < 140) L.push(['mrg', '🌀 ادمج', 'اثنين يصيرون واحد أقوى', '', () => openBook('merge')]);
  if (dd(x, y, H.arena.x, H.arena.y) < 170) L.push(['ftg', '⚔️ معركة', S.fcd > 0 ? 'بعد ' + Math.ceil(S.fcd / 1000) + 'ث' : '', 'red', () => openBook('fight')]);
  const key = L.map(a => a[0] + a[1] + a[2]).join('|'); if (key === actKey) return; actKey = key;
  const box = $('acts'); box.innerHTML = ''; L.slice(0, 4).forEach(a => { const b = document.createElement('button'); b.type = 'button'; b.className = 'act ' + a[3]; b.textContent = a[1]; if (a[2]) { const s = document.createElement('small'); s.textContent = a[2]; b.appendChild(s); } b.onclick = () => { a[4](); actKey = ''; }; box.appendChild(b); });
}

}

/* ---- الكتاب: الحقيبة، كل البرينروتات (للمشرف)، قاعدتي، البيض، الدمج، المعارك ---- */
let bookTab = 'bag', bookSel = null, adMut = 0, fightTeam = [], fightLv = 1, mergeSel = null, placing = null;

    else R.appendChild(h('p', 'دوس على أي برينروت بالحقيبة حتى تشوفه وتنصبه بقاعدتك على المنصة اللي تريدها.', 'muted'));

    const g = document.createElement('div'); g.className = 'items'; G.cat.forEach(cd => g.appendChild(itemEl(cd.id, adMut, bookSel === cd.id, () => { bookSel = cd.id; bookRender(true); }, RN[cd.r]))); L.appendChild(g);
    const mp = document.createElement('div'); mp.className = 'mutp'; mp.style.margin = '10px 0'; MN.forEach((n, i) => { const b = h('button', i ? MI[i] + ' ' + n : 'عادي'); b.type = 'button'; if (i === adMut) b.className = 'on'; b.onclick = () => { adMut = i; bookRender(true); }; mp.appendChild(b); }); L.insertBefore(mp, g);
    if (bookSel && G.cd[bookSel]) { const w = det(R, bookSel, adMut), row = document.createElement('div'); row.className = 'row'; const p1 = h('button', '📍 انصب بالقاعدة', 'btn green'); p1.type = 'button'; p1.onclick = () => startPlace({ cat: 1, id: bookSel, m: adMut }); row.appendChild(p1); w.appendChild(row); }
    else R.appendChild(h('p', 'اختار برينروت ونوعه (عادي، ذهبي، ألماس، قوس قزح) وانصبه.', 'muted'));
  } else if (bookTab === 'base') {
    L.appendChild(h('h3', '🏠 قاعدتي')); const st = document.createElement('div'); st.className = 'stat'; const rows = [['المستوى', S.lv + ' / ' + G.lvMax], ['مدة سد الباب', S.ls + ' ثانية'], ['الدخل', '+' + fmt(S.inc) + ' 💰 / ثانية'], ['المنصات', (myB.s || []).filter(Boolean).length + ' / 10'], ['التطوير الجاي', S.uc ? fmt(S.uc) + ' 💰 → ' + (S.ls + 10) + ' ثانية' : 'أعلى مستوى 👑']];
    rows.forEach(([a, b]) => { st.appendChild(h('span', a)); st.appendChild(h('b', b)); }); L.appendChild(st); L.appendChild(h('p', 'كل مستوى يزيد مدة سد الباب 10 ثواني: المستوى 1 = 40 ثانية، والمستوى 18 = 210 ثانية. تطوّر وتسد الباب من الزر الأحمر يم باب قاعدتك.', 'muted'));
    R.appendChild(h('h3', 'المنصات')); const g = document.createElement('div'); g.className = 'items'; (myB.s || []).forEach((s, i) => { if (s && !s[2] && !s[4]) g.appendChild(itemEl(s[0], s[1], false, () => {}, 'منصة ' + (i + 1))); else { const e = h('div', s && s[2] ? '🥚 بيضة' : s && s[4] ? '🦹 مسروق' : 'منصة ' + (i + 1) + ' فاضية', 'it'); e.style.cssText = 'display:grid;place-items:center;min-height:96px;color:#9a8a7a'; g.appendChild(e); } }); R.appendChild(g);
  } else if (bookTab === 'eggs') {
    L.appendChild(h('h3', '🥚 محل البيض')); L.appendChild(h('p', 'البيضة تنحط على منصة فاضية وتفقس برينروت عشوائي. كل ما البيضة أغلى، الحظ بالنادر أكثر.', 'muted'));
    const near = dd(ME[2], ME[3], G.hub.egg.x, G.hub.egg.y) < 140; if (!near) L.appendChild(h('p', '📍 روح للساحة يم محل البيض حتى تشتري.', 'muted'));
    Object.entries(G.eggs).forEach(([k, E]) => { const box = document.createElement('div'); box.style.cssText = 'display:flex;align-items:center;gap:10px;border:2px solid #cfc4ad;border-radius:14px;padding:10px;margin:8px 0;background:#fff'; const egg = document.createElement('div'); egg.style.cssText = 'width:36px;height:46px;border-radius:50%/60% 60% 40% 40%;border:3px solid #24140e;flex:none;background:' + EGN[k][1]; box.appendChild(egg); const tx = document.createElement('div'); tx.style.cssText = 'flex:1;min-width:0'; tx.appendChild(h('b', EGN[k][0])); tx.appendChild(h('div', 'تفقس بعد ' + E.t + ' ثانية • ' + Object.entries(E.w).map(([r, v]) => RN[r] + ' ' + v + '%').join('، '), 'muted')); box.appendChild(tx); const b = h('button', S.adm ? 'مجاناً' : fmt(E.p) + ' 💰', 'btn'); b.type = 'button'; b.disabled = !near; b.onclick = () => send({ t: 'br_egg', k }); box.appendChild(b); R.appendChild(box); });

    const near = dd(ME[2], ME[3], G.hub.merge.x, G.hub.merge.y) < 140; if (!near) L.appendChild(h('p', '📍 روح للساحة يم مكينة الدمج.', 'muted'));
    const sl = myB.s || [], groups = {}; sl.forEach((s, i) => { if (s && !s[2] && !s[4] && (s[1] || 0) < 3) { const k = s[0] + '_' + (s[1] || 0); (groups[k] = groups[k] || []).push(i); } });
    const pairs = Object.entries(groups).filter(([, v]) => v.length >= 2);
    if (!pairs.length) R.appendChild(h('p', 'ماكو زوج متشابه على منصاتك. انصب اثنين من نفس البرينروت ونفس النوع وارجع.', 'muted'));

    const b = h('button', S.fcd > 0 ? 'استريح ' + Math.ceil(S.fcd / 1000) + 'ث' : '⚔️ ابدي المعركة', 'btn red'); b.type = 'button'; b.disabled = !near || !fightTeam.length || S.fcd > 0; b.onclick = () => send({ t: 'br_fight', team: fightTeam, lv: fightLv }); R.appendChild(b);

}

/* ---- عرض المعركة ---- */
function playFight(d) {
  closeOv(); const O = $('fightOv'); O.hidden = false; $('fightX').hidden = true; $('fightRes').textContent = '';
  const mk = (box, arr) => { box.innerHTML = ''; return arr.map(u => { const el = document.createElement('div'); el.className = 'fu'; const cv2 = document.createElement('canvas'); el.appendChild(cv2); charCanvas(cv2, u.id, u.m); const hp = document.createElement('div'); hp.className = 'hp'; hp.innerHTML = '<i style="width:100%"></i>'; el.appendChild(hp); box.appendChild(el); return { el, max: u.hp, hp: u.hp }; }); };
  const A = mk($('tA'), d.me), E = mk($('tE'), d.en); let i = 0;
  const step = () => { if (O.hidden) return; if (i >= d.log.length) { $('fightRes').textContent = d.win ? '🏆 فزت! +' + fmt(d.reward) + ' 💰' : '💀 خسرت… قوّي فريقك وارجع'; $('fightRes').style.color = d.win ? '#ffd23f' : '#ff7a8f'; $('fightX').hidden = false; if (d.win) SFX.up(); return; }
    const [side, ai, di, dmg, crit] = d.log[i++], T = side ? A : E, u = T[di]; u.hp = Math.max(0, u.hp - dmg); u.el.querySelector('.hp i').style.width = (u.hp / u.max * 100) + '%'; u.el.classList.remove('hit'); void u.el.offsetWidth; u.el.classList.add('hit'); if (!u.hp) u.el.classList.add('dead');
    const dm = document.createElement('div'); dm.className = 'dmg' + (crit ? ' crit' : ''); dm.textContent = '-' + dmg + (crit ? '!' : ''); u.el.appendChild(dm); setTimeout(() => dm.remove(), 700); SFX.hit(); setTimeout(step, 520); };
  setTimeout(step, 600);
}
$('fightX').onclick = () => { $('fightOv').hidden = true; };
