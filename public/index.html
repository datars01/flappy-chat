<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="فلابي شات">
<meta name="theme-color" content="#4ec0ca">
<title>فلابي شات</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; background: #1d2b36; color: #fff;
    font-family: system-ui, -apple-system, "Segoe UI", Tahoma, sans-serif; }
  body { display: flex; flex-direction: column; align-items: center; overflow-x: hidden; }
  #app { width: 100%; max-width: 420px; padding: 8px 10px 14px; display: flex; flex-direction: column; gap: 8px; }
  h1 { font-size: 18px; margin: 4px 0 0; text-align: center; }
  #stage { position: relative; width: 100%; aspect-ratio: 320 / 480; max-height: 52vh; margin: 0 auto;
    border-radius: 12px; overflow: hidden; touch-action: none; background: #4ec0ca; }
  canvas { width: 100%; height: 100%; display: block; touch-action: none; direction: ltr; }
  #panel { background: #263845; border-radius: 12px; padding: 10px; display: flex; flex-direction: column; gap: 8px; }
  .row { display: flex; gap: 6px; }
  input { flex: 1; min-width: 0; padding: 10px; border-radius: 8px; border: 0; font-size: 16px; background: #fff; color: #111; }
  button { padding: 10px 14px; border-radius: 8px; border: 0; font-size: 15px; font-weight: 600; cursor: pointer;
    background: #f5a623; color: #1d1d1d; }
  button.alt { background: #4ec0ca; }
  button:disabled { opacity: .5; }
  #status { font-size: 14px; text-align: center; background: #1d2b36; border-radius: 8px; padding: 8px; min-height: 36px; line-height: 1.5; }
  #log { height: 140px; overflow-y: auto; background: #1d2b36; border-radius: 8px; padding: 8px;
    display: flex; flex-direction: column; gap: 4px; font-size: 14px; }
  .msg { padding: 5px 9px; border-radius: 10px; max-width: 85%; word-break: break-word; }
  .me { background: #2f7d4f; align-self: flex-start; }
  .them { background: #3b5568; align-self: flex-end; }
  .sys { align-self: center; opacity: .7; font-size: 12px; }
  .name { font-size: 11px; opacity: .75; display: block; }
  #chatForm { display: none; }
  #help { font-size: 12px; opacity: .65; text-align: center; }
</style>
</head>
<body>
<div id="app">
  <h1>🐦 فلابي شات</h1>

  <div id="stage"><canvas id="c" width="320" height="480"></canvas></div>

  <div id="panel">
    <div id="setup">
      <div class="row">
        <input id="nameIn" placeholder="اسمك" maxlength="16">
      </div>
      <div class="row" style="margin-top:6px">
        <input id="codeIn" placeholder="كود الغرفة (مثلاً 1234)" maxlength="12" inputmode="text" autocomplete="off">
      </div>
      <div class="row" style="margin-top:6px">
        <button id="hostBtn" class="alt" style="flex:1">إنشاء غرفة</button>
        <button id="joinBtn" style="flex:1">انضمام لغرفة</button>
      </div>
      <div id="help">واحد يسوي غرفة بكود، والثاني يدخل نفس الكود.</div>
    </div>

    <div id="status">غير متصل</div>
    <div id="log"></div>
    <form id="chatForm" class="row">
      <input id="msgIn" placeholder="اكتب رسالة..." autocomplete="off" maxlength="300">
      <button type="submit">إرسال</button>
    </form>
  </div>
</div>

<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"
  onerror="var s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js';document.head.appendChild(s);"></script>
<script>
/* ================= اللعبة ================= */
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
const W = 320, H = 480, GROUND = 60;
const GAP = 135, PIPE_W = 52, PIPE_SPACE = 175, SPEED = 2;
const GRAVITY = 0.42, FLAP = -7.2;

let state = 'ready'; // ready | play | dead
let bird, pipes, score, best = 0, frames = 0, groundX = 0;
try { best = parseInt(localStorage.getItem('flappyBest') || '0', 10) || 0; } catch (e) {}

function reset() {
  bird = { x: 80, y: H / 2 - 20, vy: 0, r: 12, rot: 0 };
  pipes = [];
  score = 0;
  frames = 0;
  for (let i = 0; i < 3; i++) addPipe(W + 60 + i * PIPE_SPACE);
}
function addPipe(x) {
  const min = 70, max = H - GROUND - GAP - 70;
  pipes.push({ x, top: min + Math.random() * (max - min), passed: false });
}
function flap() {
  if (state === 'ready') { state = 'play'; }
  if (state === 'play') { bird.vy = FLAP; }
  else if (state === 'dead' && deadTime > 25) { reset(); state = 'ready'; }
}
let deadTime = 0;

function die() {
  state = 'dead';
  deadTime = 0;
  if (score > best) {
    best = score;
    try { localStorage.setItem('flappyBest', String(best)); } catch (e) {}
  }
  sendData({ type: 'score', score: score });
}

function update(dt) {
  groundX = (groundX - SPEED * dt) % 24;
  if (state === 'ready') {
    bird.y = H / 2 - 20 + Math.sin(frames / 10) * 6;
    frames += dt;
    return;
  }
  if (state === 'dead') {
    deadTime += dt;
    if (bird.y < H - GROUND - bird.r) { bird.vy += GRAVITY * dt; bird.y += bird.vy * dt; bird.rot = Math.min(bird.rot + 0.1 * dt, 1.5); }
    return;
  }
  frames += dt;
  bird.vy += GRAVITY * dt;
  bird.y += bird.vy * dt;
  bird.rot = Math.max(-0.5, Math.min(1.3, bird.vy / 9));

  for (const p of pipes) {
    p.x -= SPEED * dt;
    if (!p.passed && p.x + PIPE_W < bird.x) { p.passed = true; score++; }
  }
  if (pipes[0].x + PIPE_W < -5) {
    pipes.shift();
    addPipe(pipes[pipes.length - 1].x + PIPE_SPACE);
  }

  if (bird.y + bird.r >= H - GROUND) { bird.y = H - GROUND - bird.r; die(); return; }
  if (bird.y - bird.r < -40) { bird.y = -40 + bird.r; }
  for (const p of pipes) {
    const inX = bird.x + bird.r - 2 > p.x && bird.x - bird.r + 2 < p.x + PIPE_W;
    if (inX && (bird.y - bird.r + 2 < p.top || bird.y + bird.r - 2 > p.top + GAP)) { die(); return; }
  }
}

function drawPipe(p) {
  ctx.fillStyle = '#73bf2e';
  ctx.strokeStyle = '#33621a';
  ctx.lineWidth = 2;
  // أعلى
  ctx.fillRect(p.x, 0, PIPE_W, p.top);
  ctx.strokeRect(p.x, -2, PIPE_W, p.top + 2);
  ctx.fillRect(p.x - 3, p.top - 20, PIPE_W + 6, 20);
  ctx.strokeRect(p.x - 3, p.top - 20, PIPE_W + 6, 20);
  // أسفل
  const by = p.top + GAP;
  ctx.fillRect(p.x, by, PIPE_W, H - GROUND - by);
  ctx.strokeRect(p.x, by, PIPE_W, H - GROUND - by);
  ctx.fillRect(p.x - 3, by, PIPE_W + 6, 20);
  ctx.strokeRect(p.x - 3, by, PIPE_W + 6, 20);
}

function drawBird() {
  ctx.save();
  ctx.translate(bird.x, bird.y);
  ctx.rotate(bird.rot);
  ctx.fillStyle = '#f8d030';
  ctx.beginPath(); ctx.ellipse(0, 0, 16, 12, 0, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = '#7a5a00'; ctx.lineWidth = 2; ctx.stroke();
  // جناح
  const wy = Math.sin(frames / 2) * 3;
  ctx.fillStyle = '#e8a800';
  ctx.beginPath(); ctx.ellipse(-4, 2 + wy, 8, 5, 0, 0, Math.PI * 2); ctx.fill();
  // عين
  ctx.fillStyle = '#fff';
  ctx.beginPath(); ctx.arc(7, -4, 5, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#000';
  ctx.beginPath(); ctx.arc(9, -4, 2, 0, Math.PI * 2); ctx.fill();
  // منقار
  ctx.fillStyle = '#f06030';
  ctx.beginPath(); ctx.moveTo(12, 0); ctx.lineTo(22, 3); ctx.lineTo(12, 7); ctx.closePath(); ctx.fill();
  ctx.restore();
}

function text(str, x, y, size, color) {
  ctx.font = 'bold ' + size + 'px system-ui, Arial';
  ctx.textAlign = 'center';
  ctx.lineWidth = 4;
  ctx.strokeStyle = '#222';
  ctx.strokeText(str, x, y);
  ctx.fillStyle = color || '#fff';
  ctx.fillText(str, x, y);
}

function draw() {
  // سماء
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, '#4ec0ca'); g.addColorStop(1, '#bfe9ee');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  // غيوم بسيطة
  ctx.fillStyle = 'rgba(255,255,255,.55)';
  for (let i = 0; i < 3; i++) {
    const cx = ((i * 140 - frames * 0.3) % (W + 80) + W + 80) % (W + 80) - 40;
    ctx.beginPath(); ctx.arc(cx, 90 + i * 55, 20, 0, 7); ctx.arc(cx + 22, 96 + i * 55, 16, 0, 7); ctx.arc(cx - 20, 98 + i * 55, 14, 0, 7); ctx.fill();
  }
  pipes.forEach(drawPipe);
  // أرض
  ctx.fillStyle = '#ded895'; ctx.fillRect(0, H - GROUND, W, GROUND);
  ctx.fillStyle = '#73bf2e'; ctx.fillRect(0, H - GROUND, W, 12);
  ctx.fillStyle = '#5da024';
  for (let x = groundX - 24; x < W + 24; x += 24) ctx.fillRect(x, H - GROUND, 12, 12);
  drawBird();

  if (state !== 'ready') text(String(score), W / 2, 70, 44);
  if (state === 'ready') {
    text('اضغط للطيران', W / 2, 150, 28);
    text('Tap to flap', W / 2, 185, 18);
  }
  if (state === 'dead') {
    ctx.fillStyle = 'rgba(0,0,0,.35)'; ctx.fillRect(40, 150, W - 80, 150);
    text('خسرت!', W / 2, 195, 30, '#ff6b6b');
    text('النتيجة: ' + score, W / 2, 235, 22);
    text('الأفضل: ' + best, W / 2, 265, 22, '#ffd166');
    if (deadTime > 25) text('اضغط للإعادة', W / 2, 330, 20);
  }
}

let last = performance.now();
function loop(t) {
  const dt = Math.min((t - last) / 16.667, 2.5);
  last = t;
  update(dt);
  draw();
  requestAnimationFrame(loop);
}
reset();
requestAnimationFrame(loop);

// إدخال: لمس / ماوس / مسطرة
const stage = document.getElementById('stage');
stage.addEventListener('pointerdown', e => { e.preventDefault(); flap(); });
document.addEventListener('keydown', e => {
  const tag = (e.target.tagName || '').toLowerCase();
  if (tag === 'input' || tag === 'textarea') return;
  if (e.code === 'Space' || e.code === 'ArrowUp') { e.preventDefault(); flap(); }
});

/* ================= الشات ================= */
const $ = id => document.getElementById(id);
const logEl = $('log'), statusEl = $('status');
let peer = null, conn = null, myName = '';

try { $('nameIn').value = localStorage.getItem('flappyName') || ''; } catch (e) {}

function addMsg(text, cls, who) {
  const d = document.createElement('div');
  d.className = 'msg ' + cls;
  if (who) { const n = document.createElement('span'); n.className = 'name'; n.textContent = who; d.appendChild(n); }
  d.appendChild(document.createTextNode(text));
  logEl.appendChild(d);
  logEl.scrollTop = logEl.scrollHeight;
}
function setStatus(s) { statusEl.textContent = s; }

function sendData(obj) {
  if (conn && conn.open) { try { conn.send(obj); } catch (e) {} }
}

function getInputs() {
  myName = $('nameIn').value.trim() || 'لاعب';
  const code = $('codeIn').value.trim().toLowerCase().replace(/[^a-z0-9]/g, '');
  try { localStorage.setItem('flappyName', myName); } catch (e) {}
  if (!code) { setStatus('اكتب كود الغرفة (أرقام أو حروف إنجليزية)'); return null; }
  return 'flappychat-' + code;
}

function lockSetup(lock) {
  ['hostBtn', 'joinBtn', 'codeIn', 'nameIn'].forEach(i => $(i).disabled = lock);
}

function onConnected(c) {
  conn = c;
  c.on('open', () => {
    clearTimeout(connTimer);
    setStatus('✅ متصل مع صديقك');
    $('setup').style.display = 'none';
    $('chatForm').style.display = 'flex';
    addMsg('تم الاتصال! اكتبوا رسائل والعبوا 🎮', 'sys');
    c.send({ type: 'hello', name: myName });
  });
  c.on('data', d => {
    if (!d || typeof d !== 'object') return;
    if (d.type === 'hello') { c.friendName = String(d.name || 'صديقك').slice(0, 16); setStatus('✅ متصل مع ' + c.friendName); }
    else if (d.type === 'chat') addMsg(String(d.text).slice(0, 300), 'them', c.friendName || 'صديقك');
    else if (d.type === 'score') addMsg((c.friendName || 'صديقك') + ' لعب وجاب ' + (parseInt(d.score, 10) || 0) + ' 🐦', 'sys');
  });
  c.on('close', () => {
    setStatus('❌ انقطع الاتصال');
    addMsg('انقطع الاتصال مع الصديق', 'sys');
    $('chatForm').style.display = 'none';
    $('setup').style.display = 'block';
    lockSetup(false);
    conn = null;
    if (peer) { peer.destroy(); peer = null; }
  });
}

function fail(err) {
  const t = err && err.type;
  if (t === 'unavailable-id') setStatus('هذا الكود مستخدم، جرّب كود ثاني');
  else if (t === 'peer-unavailable') setStatus('ما لقيت الغرفة. تأكد من الكود وإن صديقك أنشأ الغرفة أولاً');
  else if (t === 'network' || t === 'server-error' || t === 'socket-error') setStatus('مشكلة بالإنترنت أو بالسيرفر، جرّب مرة ثانية');
  else setStatus('صار خطأ: ' + (t || 'غير معروف'));
  lockSetup(false);
  if (peer) { peer.destroy(); peer = null; }
}

const PEER_OPTS = {
  debug: 1,
  config: { iceServers: [
    { urls: 'stun:stun.l.google.com:19302' },
    { urls: 'stun:stun1.l.google.com:19302' },
    { urls: 'turn:openrelay.metered.ca:80', username: 'openrelayproject', credential: 'openrelayproject' },
    { urls: 'turn:openrelay.metered.ca:443', username: 'openrelayproject', credential: 'openrelayproject' }
  ] }
};
let connTimer = null;
function startTimer(msg, ms) {
  clearTimeout(connTimer);
  connTimer = setTimeout(() => {
    setStatus(msg);
    lockSetup(false);
    if (peer) { try { peer.destroy(); } catch (e) {} peer = null; }
  }, ms || 15000);
}

$('hostBtn').onclick = () => {
  const id = getInputs(); if (!id) return;
  if (typeof Peer === 'undefined') { setStatus('❌ مكتبة الاتصال ما تحمّلت. تأكد من الإنترنت وسوّي تحديث للصفحة'); return; }
  lockSetup(true);
  setStatus('⏳ جاري إنشاء الغرفة...');
  startTimer('❌ ما قدرت أتصل بالخادم. تأكد من الإنترنت وجرب مرة ثانية');
  peer = new Peer(id, PEER_OPTS);
  peer.on('open', () => {
    clearTimeout(connTimer);
    setStatus('✅ الغرفة جاهزة! خلّي صديقك يدخل نفس الكود: ' + id.replace('flappychat-', ''));
    addMsg('بانتظار دخول صديقك بالكود ' + id.replace('flappychat-', ''), 'sys');
  });
  peer.on('connection', c => { if (conn && conn.open) { c.close(); return; } onConnected(c); });
  peer.on('disconnected', () => { try { peer.reconnect(); } catch (e) {} });
  peer.on('error', e => { clearTimeout(connTimer); fail(e); });
};

$('joinBtn').onclick = () => {
  const id = getInputs(); if (!id) return;
  if (typeof Peer === 'undefined') { setStatus('❌ مكتبة الاتصال ما تحمّلت. تأكد من الإنترنت وسوّي تحديث للصفحة'); return; }
  lockSetup(true);
  setStatus('⏳ جاري الاتصال بالغرفة...');
  startTimer('❌ ما قدرت أتصل بالغرفة. تأكد إن صديقك أنشأ الغرفة أولاً وبنفس الكود', 20000);
  peer = new Peer(undefined, PEER_OPTS);
  peer.on('open', () => onConnected(peer.connect(id, { reliable: true })));
  peer.on('disconnected', () => { try { peer.reconnect(); } catch (e) {} });
  peer.on('error', e => { clearTimeout(connTimer); fail(e); });
};

$('chatForm').addEventListener('submit', e => {
  e.preventDefault();
  const v = $('msgIn').value.trim();
  if (!v || !conn || !conn.open) return;
  conn.send({ type: 'chat', text: v });
  addMsg(v, 'me', 'أنت');
  $('msgIn').value = '';
});
</script>
</body>
</html>
