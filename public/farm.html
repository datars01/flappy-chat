<!doctype html>
<html lang="ar" dir="rtl">

<title>سباق المزرعة</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lalezar&family=Tajawal:wght@500;700;900&display=swap">
<style>
/* التخطيط: لعبة شاشة وحدة — أهداف المرحلة والوقت فوك، الساحة (كانفس) بالنص، دكّة شراء الحيوانات تحت */
:root {
  --wood: #5b3a1f; --wood2: #7b5130; --panel: #eef5e4; --ink: #24301c; --ink2: #5d6b52;
  --gold: #f5b915; --silver: #c9d1db; --bronze: #d98b4a; --good: #2f9e44; --bad: #d9480f;
  --display: "Lalezar", "Tajawal", system-ui, sans-serif; --body: "Tajawal", system-ui, sans-serif;
  color-scheme: light;
}
html, body { height: 100%; }
body { background: #2d4a1f; color: var(--ink); font-family: var(--body); overflow: hidden; -webkit-tap-highlight-color: transparent; user-select: none; }
#app { height: 100%; display: flex; flex-direction: column; direction: rtl; max-width: 560px; margin: 0 auto; background: linear-gradient(#3b5e27, #2d4a1f); }
.bar { background: linear-gradient(var(--wood2), var(--wood)); padding-block: 7px; padding-left: max(10px, env(safe-area-inset-left, 0px)); padding-right: max(10px, env(safe-area-inset-right, 0px)); display: flex; align-items: center; gap: 6px; }
#top { border-bottom: 3px solid #3d2612; flex-wrap: wrap; }
.pill { display: flex; align-items: center; gap: 5px; background: rgba(0,0,0,.3); color: #fff; border-radius: 999px; padding: 4px 11px; font-weight: 900; font-size: 15px; font-variant-numeric: tabular-nums; border: 1px solid rgba(255,255,255,.12); }
#lv { font: 400 18px var(--display); background: #f1b93a; color: #5a3800; border-color: #fff4c0; }
#goals { flex: 1; display: flex; gap: 5px; justify-content: center; min-width: 0; flex-wrap: wrap; }
.goal { display: flex; align-items: center; gap: 3px; background: rgba(255,255,255,.16); color: #fff; padding: 3px 8px; border-radius: 10px; font-weight: 900; font-size: 13px; font-variant-numeric: tabular-nums; border: 1px solid transparent; }
.goal.ok { background: #2f9e44; border-color: #b9f5c0; }
#timer .st { width: 14px; height: 14px; border-radius: 50%; background: var(--gold); box-shadow: 0 0 0 2px rgba(255,255,255,.4); }

#cv { display: block; touch-action: manipulation; border-radius: 14px; box-shadow: 0 6px 24px rgba(0,0,0,.35); }
#toast { position: absolute; top: 10px; left: 50%; transform: translate(-50%, -8px); background: rgba(30,40,20,.92); color: #fff; padding: 8px 16px; border-radius: 14px; font-weight: 700; font-size: 14px; opacity: 0; transition: .25s; pointer-events: none; max-width: 88%; text-align: center; }
#toast.on { opacity: 1; transform: translate(-50%, 0); }
#dock { border-top: 3px solid #3d2612; padding-block: 8px calc(8px + env(safe-area-inset-bottom, 0px)); }
.buy { flex: 1; border: 0; border-radius: 14px; padding: 7px 4px; font: 900 14px var(--body); color: #fff; background: linear-gradient(#4f9a3a, #3a7a29); box-shadow: 0 3px 0 #24501a; display: flex; align-items: center; justify-content: center; gap: 6px; cursor: pointer; }
.buy .e { font-size: 22px; } .buy small { color: #ffe27a; font-weight: 900; font-size: 13px; }
.buy:active { transform: translateY(2px); box-shadow: 0 1px 0 #24501a; }
.buy[disabled] { filter: grayscale(.8); opacity: .6; }
.buy.sm { flex: none; width: 50px; background: rgba(255,255,255,.16); box-shadow: none; }
button:focus-visible { outline: 3px solid #fff; outline-offset: 2px; }
/* اللوحات */
#ov { position: fixed; inset: 0; background: rgba(10,16,6,.6); display: flex; align-items: center; justify-content: center; z-index: 20; padding: 16px; }
#ovBox { width: 100%; max-width: 420px; max-height: 88%; overflow: auto; background: var(--panel); border-radius: 22px; direction: rtl; animation: pop .25s ease-out; box-shadow: 0 10px 40px rgba(0,0,0,.4); }
@keyframes pop { from { transform: scale(.9); opacity: .3; } }
.oh { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 12px 16px; background: linear-gradient(var(--wood2), var(--wood)); color: #fff; border-radius: 22px 22px 0 0; }
.oh h3 { margin: 0; font: 400 26px var(--display); }
.oh button { border: 0; background: rgba(255,255,255,.2); color: #fff; border-radius: 10px; padding: 6px 12px; font: 900 14px var(--body); cursor: pointer; }
.ob { padding: 14px 16px 16px; display: flex; flex-direction: column; gap: 10px; }

.node { border: 0; border-radius: 18px; padding: 10px 4px; background: #fff; border: 2px solid #d7e3c8; display: flex; flex-direction: column; align-items: center; gap: 2px; cursor: pointer; font-family: var(--body); color: var(--ink); }

.node .stars { letter-spacing: 1px; font-size: 14px; }
.node.lock { opacity: .5; cursor: default; }
.node.cur { border-color: #f1b93a; box-shadow: 0 0 0 3px rgba(241,185,58,.35); }

.times span { padding: 4px 10px; border-radius: 10px; background: #fff; border: 1px solid #d7e3c8; }

.row .tx { flex: 1; min-width: 0; } .row .tx b { display: block; } .row .tx small { color: var(--ink2); }
.row .q { font: 400 20px var(--display); min-width: 46px; text-align: center; font-variant-numeric: tabular-nums; }
.row button { border: 0; width: 34px; height: 34px; border-radius: 10px; font: 900 18px var(--body); color: #fff; background: var(--good); cursor: pointer; }
.row button.m { background: #b4563a; }
.bigStars { font-size: 44px; text-align: center; letter-spacing: 6px; }
.bigStars .off { filter: grayscale(1); opacity: .3; }
.buy { gap: 3px; padding: 6px 2px; } .buy.up { background: linear-gradient(#e0a42a, #c4841a); box-shadow: 0 3px 0 #7a4f10; }
.buy.sm { width: 42px; }
.goal { position: relative; overflow: hidden; } .goal i { position: absolute; inset: 0; right: auto; background: rgba(155,225,93,.35); pointer-events: none; } .goal span { position: relative; }
.row .ub { width: auto; padding: 0 12px; font-size: 14px; background: #e0a42a; } .row .ub[disabled] { background: #b8c2ae; }
.splash { padding: 26px 18px 20px; text-align: center; display: flex; flex-direction: column; gap: 14px; background: radial-gradient(circle at 50% 0%, #fff7c8, var(--panel) 70%); border-radius: 22px; }
.splash h1 { margin: 0; font: 400 52px/1 var(--display); color: #b23a26; text-shadow: 0 3px 0 #f1b93a, 0 6px 14px rgba(0,0,0,.2); text-wrap: balance; }
.splash .ani { font-size: 38px; display: flex; justify-content: center; gap: 10px; } .splash .ani span { display: inline-block; animation: hop 1.2s ease-in-out infinite; } .splash .ani span:nth-child(2) { animation-delay: .15s; } .splash .ani span:nth-child(3) { animation-delay: .3s; } .splash .ani span:nth-child(4) { animation-delay: .45s; }
@keyframes hop { 0%,100% { transform: translateY(0); } 40% { transform: translateY(-12px); } }
.path { position: relative; height: 560px; margin: 0 auto; max-width: 340px; width: 100%; }
.path svg { position: absolute; inset: 0; width: 100%; height: 100%; }
.pn { position: absolute; transform: translate(50%, -50%); width: 70px; display: flex; flex-direction: column; align-items: center; gap: 2px; border: 0; background: none; cursor: pointer; font-family: var(--body); padding: 0; }
.pn b { width: 58px; height: 58px; border-radius: 50%; display: grid; place-items: center; font: 400 28px var(--display); color: #fff; background: radial-gradient(circle at 35% 30%, #9be15d, #3a7a29); border: 3px solid #fff; box-shadow: 0 4px 0 #24501a, 0 6px 14px rgba(0,0,0,.25); }
.pn.lock b { background: radial-gradient(circle at 35% 30%, #c8ccc0, #8a9080); box-shadow: 0 4px 0 #5a6050; font-size: 22px; }
.pn.cur b { background: radial-gradient(circle at 35% 30%, #ffe27a, #e0a42a); box-shadow: 0 4px 0 #7a4f10, 0 0 0 6px rgba(241,185,58,.35); animation: hop 1.4s ease-in-out infinite; }
.pn small { font-size: 13px; letter-spacing: 1px; background: rgba(255,255,255,.85); border-radius: 8px; padding: 0 5px; }
.bigStars span { display: inline-block; animation: starIn .5s cubic-bezier(.3,1.6,.5,1) both; } .bigStars span:nth-child(2) { animation-delay: .35s; } .bigStars span:nth-child(3) { animation-delay: .7s; }
@keyframes starIn { from { transform: scale(0) rotate(-90deg); opacity: 0; } }
@media (prefers-reduced-motion: reduce) { #ovBox { animation: none; } .splash .ani span, .pn.cur b, .bigStars span { animation: none; } }
</style>

</div>
<div id="ov" hidden><div id="ovBox"></div></div>

<script>
'use strict';
/* ================= سباق المزرعة 🚜 — نموذج تجريبي =================
   دوس على الساحة تزرع حشيش (من مي البير) • الحيوانات تاكل وتنتج • دوس المنتج تجمعه للمخزن
   المخبز: بيضة ← كيك • الألبان: حليب ← جبن • الشاحنة تبيع بالمدينة • الدب: دوسه 5 مرات تحبسه */
const W = 400, H = 600, F = { x0: 16, x1: 384, y0: 132, y1: 518 };
const ITEMS = { egg: { n: 'بيض', e: '🥚', s: 10 }, milk: { n: 'حليب', e: '🥛', s: 25 }, cake: { n: 'كيك', e: '🍰', s: 45 }, cheese: { n: 'جبن', e: '🧀', s: 90 } };
const ANI = { hen: { n: 'دجاجة', p: 80, prod: 'egg', every: 8, eat: 0.11, sp: 22, r: 13 }, cow: { n: 'بقرة', p: 300, prod: 'milk', every: 13, eat: 0.08, sp: 12, r: 22 } };
const WS = { bake: { n: 'المخبز', in: 'egg', out: 'cake', t: 6, x: 152, y: 66, c: '#e8875a', sign: '🍰' }, dairy: { n: 'الألبان', in: 'milk', out: 'cheese', t: 9, x: 250, y: 66, c: '#5a9ae8', sign: '🧀' } };
const GN = { egg: '🥚', milk: '🥛', cake: '🍰', cheese: '🧀', hen: '🐔', cow: '🐄', coins: '🪙', bear: '🐻' };
const LEVELS = [
  { coins: 200, goals: [['egg', 8], ['hen', 4]], gold: 80, silver: 140, shop: ['hen'], ws: [], bears: [], start: { hen: 2 }, tut: 1 },
  { coins: 220, goals: [['cake', 4], ['coins', 420]], gold: 140, silver: 230, shop: ['hen'], ws: ['bake'], bears: [75], start: { hen: 3 } },
  { coins: 300, goals: [['egg', 20], ['hen', 6]], gold: 150, silver: 240, shop: ['hen', 'cat'], ws: ['bake'], bears: [40, 120], start: { hen: 3 } },
  { coins: 420, goals: [['cheese', 3], ['cake', 3], ['bear', 2]], gold: 210, silver: 320, shop: ['hen', 'cow', 'cat'], ws: ['bake', 'dairy'], bears: [35, 100, 170], start: { hen: 3 } },
  { coins: 500, goals: [['milk', 10], ['cow', 3], ['coins', 900]], gold: 230, silver: 340, shop: ['hen', 'cow', 'cat'], ws: ['bake', 'dairy'], bears: [30, 90, 150, 210], start: { hen: 2, cow: 1 } },
  { coins: 450, goals: [['cheese', 6], ['coins', 1300]], gold: 270, silver: 400, shop: ['hen', 'cow', 'cat'], ws: ['bake', 'dairy'], bears: [30, 75, 120, 165, 210, 255], start: { hen: 2, cow: 1 } },
  { coins: 500, goals: [['cake', 10], ['cheese', 6], ['bear', 4]], gold: 320, silver: 460, shop: ['hen', 'cow', 'cat'], ws: ['bake', 'dairy'], bears: [25, 65, 105, 145, 185, 225, 265], start: { hen: 3, cow: 1 } },
  { coins: 600, goals: [['cheese', 10], ['cake', 10], ['coins', 2500]], gold: 400, silver: 560, shop: ['hen', 'cow', 'cat'], ws: ['bake', 'dairy'], bears: [20, 55, 90, 125, 160, 195, 230, 265, 300, 335], start: { hen: 3, cow: 2 } }];
/* تطوير المباني داخل المرحلة (مثل اللعبة الأصلية: كل مرحلة تبدي من الصفر) */
const UP = { well: { n: 'البير', e: '💧', c: [120, 260], d: ['6 سطول • يملي ببطء', '9 سطول • أسرع', '12 سطل • سريع جداً'] }, wh: { n: 'المخزن', e: '📦', c: [150, 320], d: ['يشيل 14', 'يشيل 22', 'يشيل 32'] },
  bake: { n: 'المخبز', e: '🍰', c: [180, 380], d: ['سرعة عادية', 'أسرع 25%', 'أسرع 45%'] }, dairy: { n: 'الألبان', e: '🧀', c: [260, 520], d: ['سرعة عادية', 'أسرع 25%', 'أسرع 45%'] }, truck: { n: 'الشاحنة', e: '🚚', c: [200, 420], d: ['تشيل 8 • 10ث', 'تشيل 12 • 8ث', 'تشيل 16 • 6ث'] } };
const wellCap = () => [6, 9, 12][G.up.well], wellTime = () => [2.5, 1.7, 1][G.up.well], capW = () => [14, 22, 32][G.up.wh], wsMul = k => [1, 0.75, 0.55][G.up[k]], trCap = () => [8, 12, 16][G.up.truck], trTime = () => [10, 8, 6][G.up.truck];
const CAT_P = 150;
const $ = id => document.getElementById(id);
const KEY = 'frenzy_rbsh_v1';
let P = { open: 1, stars: [], snd: 1 };
try { const o = JSON.parse(localStorage.getItem(KEY) || 'null'); if (o) P = Object.assign(P, o); } catch (e) {}
let ADM = /[?&]adm=1/.test(location.search); // المشرفين (بابي وبابيتو): شراء وتطوير ومي لانهائي
const saveP = () => { try { localStorage.setItem(KEY, JSON.stringify(P)); } catch (e) {} };

/* ---------- الصوت ---------- */
let AC = null, NB = null;
function ac() { if (!AC) { try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} } if (AC && AC.state === 'suspended') AC.resume(); }
function tone(type, f0, f1, d, v, dl) { const a = AC; if (!a || !P.snd || a.state !== 'running') return; const t = a.currentTime + (dl || 0), o = a.createOscillator(), g = a.createGain(); o.type = type; o.frequency.setValueAtTime(f0, t); if (f1) o.frequency.exponentialRampToValueAtTime(f1, t + d); g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(v, t + 0.015); g.gain.exponentialRampToValueAtTime(0.0001, t + d); o.connect(g); g.connect(a.destination); o.start(t); o.stop(t + d + 0.05); }
function noise(d, v, f, type, dl) { const a = AC; if (!a || !P.snd || a.state !== 'running') return; if (!NB) { NB = a.createBuffer(1, a.sampleRate, a.sampleRate); const c = NB.getChannelData(0); for (let i = 0; i < c.length; i++) c[i] = Math.random() * 2 - 1; } const t = a.currentTime + (dl || 0), s = a.createBufferSource(), fl = a.createBiquadFilter(), g = a.createGain(); s.buffer = NB; fl.type = type || 'bandpass'; fl.frequency.value = f; s.connect(fl); fl.connect(g); g.connect(a.destination); g.gain.setValueAtTime(v, t); g.gain.exponentialRampToValueAtTime(0.0001, t + d); s.start(t); s.stop(t + d); }
const SFX = {
  grass: () => { noise(0.18, 0.1, 1800); tone('sine', 500, 800, 0.08, 0.05); }, well: () => { noise(0.7, 0.1, 900); tone('sine', 300, 600, 0.3, 0.04, 0.4); },
  pick: () => { tone('sine', 700, 1300, 0.09, 0.08); }, coin: () => { tone('square', 988, 0, 0.07, 0.05); tone('square', 1319, 0, 0.12, 0.05, 0.06); },
  bad: () => tone('sawtooth', 220, 140, 0.18, 0.06), cluck: () => [0, 0.08, 0.18].forEach((d, i) => tone('square', 900 - i * 80, 520, 0.05, 0.035, d)),
  moo: () => { tone('sawtooth', 150, 105, 0.8, 0.07); tone('sine', 300, 210, 0.8, 0.04); }, lay: () => { tone('triangle', 600, 900, 0.1, 0.07); },
  hit: () => { noise(0.08, 0.2, 400, 'lowpass'); tone('square', 200, 120, 0.1, 0.08); }, cage: () => { [300, 250, 200].forEach((f, i) => tone('square', f, 0, 0.08, 0.07, i * 0.07)); noise(0.3, 0.15, 3000, 'highpass', 0.2); },
  roar: () => { tone('sawtooth', 140, 70, 0.7, 0.09); noise(0.6, 0.12, 300, 'lowpass'); }, die: () => tone('triangle', 500, 120, 0.6, 0.07),
  ws: () => { [523, 659].forEach((f, i) => tone('sine', f, 0, 0.1, 0.06, i * 0.07)); }, truck: () => { tone('sawtooth', 70, 95, 1, 0.05); tone('square', 440, 0, 0.15, 0.05, 0.6); tone('square', 440, 0, 0.15, 0.05, 0.85); },
  win: () => [523, 659, 784, 1047, 784, 1047, 1319].forEach((f, i) => tone('triangle', f, 0, 0.22, 0.1, i * 0.11)), goal: () => [784, 1175].forEach((f, i) => tone('sine', f, 0, 0.18, 0.08, i * 0.09)) };
const sfx = k => { try { SFX[k](); } catch (e) {} };
/* موسيقى ريفية خفيفة (بانجو وبيس) */
const MU = { next: 0, i: 0 }, MEL = [67, 69, 71, 74, 71, 69, 67, 64, 62, 64, 67, 69, 71, 69, 67, 0, 74, 76, 74, 71, 69, 71, 67, 0, 64, 67, 69, 71, 69, 67, 64, 62], BAS = [43, 43, 48, 48, 50, 50, 43, 43];
const hz = m => 440 * Math.pow(2, (m - 69) / 12);
function music() { const a = AC; if (!a || a.state !== 'running' || !P.mus || !P.snd || !G || !G.run || document.hidden) { if (a) MU.next = a.currentTime + 0.1; return; } const st = 60 / 116 / 2;
  if (MU.next < a.currentTime) MU.next = a.currentTime + 0.05;
  while (MU.next < a.currentTime + 0.2) { const t = MU.next - a.currentTime, i = MU.i, m = MEL[i % 32]; if (m) { tone('triangle', hz(m), 0, 0.22, 0.035, t); tone('square', hz(m + 12), 0, 0.06, 0.008, t); } if (i % 4 === 0) tone('sine', hz(BAS[(i / 4) % 8]), 0, 0.3, 0.07, t); if (i % 4 === 2) noise(0.05, 0.03, 5000, 'highpass', t); MU.i++; MU.next += st; } }
if (P.mus == null) P.mus = 1;

/* ---------- الحالة ---------- */
let G = null;
function startLevel(n) {
  const L = LEVELS[n - 1]; G = { n, L, t: 0, coins: L.coins, water: 6, wellT: 0, up: { well: 0, wh: 0, bake: 0, dairy: 0, truck: 0 }, cats: [], combo: 0, lastPick: -9, tut: L.tut ? 1 : 0, grass: [], ani: [], items: [], bears: [], wh: {}, ws: {}, truck: { st: 'home', t: 0, load: {}, x: 0, earn: 0 }, cnt: { egg: 0, milk: 0, cake: 0, cheese: 0, bear: 0 }, fx: [], won: 0, bi: 0, run: 1 };
  L.ws.forEach(k => G.ws[k] = { busy: 0, q: 0 });
  for (const k in L.start) for (let i = 0; i < L.start[k]; i++) addAni(k);
  for (let i = 0; i < 6; i++) G.grass.push({ x: 80 + Math.random() * 240, y: 200 + Math.random() * 240, a: 3 });
  hideOv(); goalsUI(true); shopUI(); hud(); toast('🎯 المرحلة ' + n + ': ' + L.goals.map(q => GN[q[0]] + ' ' + q[1]).join(' + '));
}
function addAni(k) { G.ani.push({ k, x: 120 + Math.random() * 160, y: 260 + Math.random() * 160, hu: 0, pr: 0, dead: 0, starve: 0, dir: 1, tx: null, ty: null, wait: 0, eat: 0 }); }
const whN = () => Object.values(G.wh).reduce((a, b) => a + b, 0);

}
function brief(n) {
  const L = LEVELS[n - 1], f = s => Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0');
  const names = { egg: 'اجمع بيض', milk: 'اجمع حليب', cake: 'اصنع كيك', cheese: 'اصنع جبن', hen: 'خلي عندك دجاج', cow: 'خلي عندك بقر', coins: 'جمّع عملات', bear: 'احبس دببة' };
  let h = '<div class="oh"><h3>المرحلة ' + n + '</h3><button type="button" id="bk">رجوع</button></div><div class="ob"><div class="gl">' + L.goals.map(q => '<div><span>' + GN[q[0]] + ' ' + names[q[0]] + '</span><b>' + q[1] + '</b></div>').join('') + '</div>';
  h += '<div class="times"><span>⭐⭐⭐ قبل ' + f(L.gold) + '</span><span>⭐⭐ قبل ' + f(L.silver) + '</span><span>⭐ بعدها</span></div>';
  h += '<p class="note">' + (L.bears.length ? '🐻 انتبه: راح تهجم ' + L.bears.length + ' دببة! ' : '') + (L.ws.length ? 'المصانع: ' + L.ws.map(k => WS[k].n).join(' و') : '') + '</p><button type="button" class="big" id="go">▶ ابدأ</button></div>';
  ov(h); $('go').onclick = () => startLevel(n); $('bk').onclick = showMap;
}
function win() {
  const L = G.L, s = Math.floor(G.t), st = s <= L.gold ? 3 : s <= L.silver ? 2 : 1, bonus = st === 3 ? 300 : st === 2 ? 150 : 50;
  for (let i = 0; i < 70; i++) G.fx.push({ k: 'p', x: W / 2 + (Math.random() - 0.5) * 300, y: 200, vx: (Math.random() - 0.5) * 220, vy: -120 - Math.random() * 200, c: ['#ffd84a', '#ff5a7a', '#5ab8ff', '#9be15d', '#fff'][i % 5], t: 2 + Math.random(), r: 2.5 + Math.random() * 2 });
  P.stars[G.n - 1] = Math.max(P.stars[G.n - 1] || 0, st); P.open = Math.max(P.open, Math.min(LEVELS.length, G.n + 1)); saveP(); sfx('win');
  let h = '<div class="oh"><h3>🎉 خلصت المرحلة ' + G.n + '!</h3></div><div class="ob"><div class="bigStars">' + [1, 2, 3].map(i => '<span class="' + (i <= st ? '' : 'off') + '">⭐</span>').join('') + '</div>';
  h += '<p class="note">وقتك: <b>' + Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0') + '</b> • مكافأة: 🪙 ' + bonus + '</p>';
  h += (G.n < LEVELS.length ? '<button type="button" class="big" id="nx">المرحلة الجاية ◀</button>' : '<p class="note">🏆 خلصت كل مراحل النموذج!</p>') + '<button type="button" class="big alt" id="re">🔁 عيدها لنجوم أكثر</button><button type="button" class="big alt" id="mp">🗺️ المراحل</button></div>';
  ov(h); const nx = $('nx'); if (nx) nx.onclick = () => brief(G.n + 1); $('re').onclick = () => startLevel(G.n); $('mp').onclick = showMap;
}
function openWh() {
  G.run = 0; const ks = Object.keys(G.wh).filter(k => G.wh[k] > 0);
  let h = '<div class="oh"><h3>📦 المخزن ' + whN() + '/' + capW() + '</h3><button type="button" data-x>سد</button></div><div class="ob">';
  if (!ks.length) h += '<p class="note">المخزن فارغ — دوس على المنتجات بالأرض حتى تجمعها</p>';
  ks.forEach(k => h += '<div class="row"><span class="e">' + ITEMS[k].e + '</span><div class="tx"><b>' + ITEMS[k].n + '</b><small>يبيع بـ ' + ITEMS[k].s + ' 🪙 بالمدينة</small></div><span class="q">' + G.wh[k] + '</span></div>');
  h += '<p class="note">البيع يصير بالشاحنة 🚚 تحت • المصانع تاخذ من المخزن</p></div>'; ov(h);
}
function openTruck() {
  G.run = 0; const tr = G.truck, cap = trCap(), ln = () => Object.values(tr.load).reduce((a, b) => a + b, 0);
  const render = () => {
    const ks = Object.keys(ITEMS).filter(k => (G.wh[k] || 0) + (tr.load[k] || 0) > 0); let sum = 0; for (const k in tr.load) sum += tr.load[k] * ITEMS[k].s;
    let h = '<div class="oh"><h3>🚚 الشاحنة ' + ln() + '/' + cap + '</h3><button type="button" id="tx">سد</button></div><div class="ob">';
    if (!ks.length) h += '<p class="note">ما عندك شي تبيعه — اجمع منتجات للمخزن</p>';
    ks.forEach(k => h += '<div class="row"><span class="e">' + ITEMS[k].e + '</span><div class="tx"><b>' + ITEMS[k].n + '</b><small>بالمخزن: ' + (G.wh[k] || 0) + ' • ' + ITEMS[k].s + ' 🪙</small></div><button type="button" class="m" data-m="' + k + '">−</button><span class="q">' + (tr.load[k] || 0) + '</span><button type="button" data-p="' + k + '">+</button></div>');
    h += '<button type="button" class="big"' + (ln() ? '' : ' disabled style="opacity:.5"') + ' id="send">🚚 روح للمدينة (+' + sum + ' 🪙)</button></div>'; ov(h);
    $('ovBox').querySelectorAll('[data-p]').forEach(b => b.onclick = () => { const k = b.dataset.p; if (!(G.wh[k] > 0) || ln() >= cap) { sfx('bad'); return; } G.wh[k]--; tr.load[k] = (tr.load[k] || 0) + 1; sfx('pick'); render(); });
    $('ovBox').querySelectorAll('[data-m]').forEach(b => b.onclick = () => { const k = b.dataset.m; if (!(tr.load[k] > 0)) return; tr.load[k]--; G.wh[k] = (G.wh[k] || 0) + 1; render(); });
    $('tx').onclick = () => { for (const k in tr.load) G.wh[k] = (G.wh[k] || 0) + tr.load[k]; tr.load = {}; hideOv(); G.run = 1; };
    $('send').onclick = () => { if (!ln()) return; tr.earn = sum; tr.st = 'go'; tr.t = 0; if (G.tut === 3) G.tut = 0; sfx('truck'); hideOv(); G.run = 1; toast('🚚 الشاحنة راحت للمدينة'); };
  }; render();
}

/* ---------- الحلقة ---------- */
let last = 0, hudT = 0;
function loop(ts) { const dt = Math.min(0.05, (ts - (last || ts)) / 1000); last = ts; try { if (G) { tick(dt); draw(dt); if ((hudT += dt) > 0.25) { hudT = 0; hud(); } music(); } } catch (e) { console.error(e); } requestAnimationFrame(loop); }
fit(); requestAnimationFrame(fit); setTimeout(fit, 300);
startLevel(Math.min(P.open, LEVELS.length)); G.run = 0; splash();
requestAnimationFrame(loop);
window.addEventListener('message', e => { if (typeof e.data === 'string' && e.data.indexOf('farm:adm:') === 0) { ADM = e.data === 'farm:adm:1'; if (G) { hud(); shopUI(); } return; } if (e.data === 'farm:pause' && G && G.run && !G.won) { G.run = 0; showMap(); } });
</script>
