<style>
/* التخطيط: لعبة شاشة وحدة — شريط الأهداف فوك، ساحة المزرعة HD بالنص (كانفس)، شريط الأدوات الخشبي تحت */
:root {
  --wood: #5b3a1f; --wood2: #7d5332; --woodEdge: #3d2612;
  --panel: #eef4e2; --card: #ffffff; --line: #d4e1c2; --ink: #22301a; --ink2: #5b6a4f;
  --gold: #f2b632; --good: #2f9e44; --goodDk: #24501a; --amber: #e0a42a; --amberDk: #7a4f10; --bad: #c2410c;
  --ground: #2d4a1f; --white: #ffffff; --chip: rgba(0,0,0,.3);
  --display: "Lalezar", "Tajawal", system-ui, sans-serif; --body: "Tajawal", system-ui, sans-serif;
  color-scheme: light;
}
html, body { height: 100%; }
body { background: var(--ground); color: var(--ink); font-family: var(--body); overflow: hidden; -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none; }
#app { height: 100%; display: flex; flex-direction: column; direction: rtl; background: linear-gradient(#3b5e27, #2d4a1f); }
.bar { background: linear-gradient(var(--wood2), var(--wood)); padding-block: 7px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: flex; align-items: center; gap: 6px; }
#top { border-bottom: 3px solid var(--woodEdge); flex-wrap: wrap; }
.pill { display: flex; align-items: center; gap: 5px; background: var(--chip); color: var(--white); border-radius: 999px; padding: 4px 11px; font-weight: 900; font-size: 15px; font-variant-numeric: tabular-nums; border: 1px solid rgba(255,255,255,.12); }
#lv { font: 400 18px var(--display); background: var(--gold); color: #5a3800; border-color: #fff4c0; }
#goals { order: 9; flex: 1 0 100%; display: flex; gap: 5px; justify-content: center; min-width: 0; flex-wrap: wrap; }
#goals:empty { display: none; }
#top .grow { flex: 1; }
.goal { position: relative; overflow: hidden; display: flex; align-items: center; gap: 3px; background: rgba(255,255,255,.16); color: var(--white); padding: 2px 8px 2px 6px; border-radius: 10px; font-weight: 900; font-size: 13px; font-variant-numeric: tabular-nums; border: 1px solid transparent; }
.goal img { width: 20px; height: 20px; position: relative; }
.goal i { position: absolute; inset: 0; right: auto; background: rgba(155,225,93,.35); pointer-events: none; }
.goal span { position: relative; } .goal.ok { background: var(--good); border-color: #b9f5c0; }
#timer .st { width: 14px; height: 14px; border-radius: 50%; background: var(--gold); box-shadow: 0 0 0 2px rgba(255,255,255,.4); }
#stage { flex: 1; min-height: 0; position: relative; display: grid; place-items: center; overflow: hidden; }
#cv { display: block; touch-action: manipulation; }
#toast { position: absolute; top: 10px; left: 50%; transform: translate(-50%, -8px); background: rgba(30,40,20,.92); color: var(--white); padding: 8px 16px; border-radius: 14px; font-weight: 700; font-size: 14px; opacity: 0; transition: .25s; pointer-events: none; max-width: 88%; text-align: center; line-height: 1.5; }
#toast.on { opacity: 1; transform: translate(-50%, 0); }
#dock { border-top: 3px solid var(--woodEdge); padding-block: 7px calc(7px + env(safe-area-inset-bottom, 0px)); gap: 5px; }
.db { flex: 1; min-width: 0; border: 0; border-radius: 12px; padding: 5px 2px 4px; background: rgba(255,255,255,.13); color: var(--white); font: 700 11px var(--body); display: flex; flex-direction: column; align-items: center; gap: 1px; cursor: pointer; box-shadow: 0 3px 0 rgba(0,0,0,.25); }
.db .e { font-size: 21px; line-height: 1.1; }
.db.main { background: linear-gradient(#4f9a3a, #3a7a29); box-shadow: 0 3px 0 var(--goodDk); }
.db.off { opacity: .45; }
.db:active { transform: translateY(2px); box-shadow: 0 1px 0 rgba(0,0,0,.25); }
button:focus-visible { outline: 3px solid var(--white); outline-offset: 2px; }
#bFull[hidden] { display: none !important; }
@media (orientation: landscape) {
  #app { display: grid; grid-template-columns: minmax(0, 1fr) auto; grid-template-rows: auto minmax(0, 1fr); }
  #top { grid-column: 1 / -1; flex-wrap: nowrap; padding-block: 5px; }
  #goals { order: 0; flex: 1 1 auto; flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; }
  #goals::-webkit-scrollbar { display: none; }
  #top .grow { display: none; }
  #stage { grid-column: 1; grid-row: 2; padding-right: env(safe-area-inset-right, 0px); }
  #dock { grid-column: 2; grid-row: 2; flex-direction: column; border-top: 0; border-right: 3px solid var(--woodEdge); padding-block: 6px calc(6px + env(safe-area-inset-bottom, 0px)); padding-right: 6px; padding-left: max(6px, env(safe-area-inset-left, 0px)); }
  .db { flex: 1 1 0; min-height: 0; width: 64px; justify-content: center; padding: 2px; font-size: 10px; }
  .db .e { font-size: 18px; }
  #dock { gap: 4px; }
}
/* اللوحات */
#ov { position: fixed; inset: 0; background: rgba(10,16,6,.62); display: flex; align-items: center; justify-content: center; z-index: 20; padding: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
#ov[hidden] { display: none; }
#ovBox { width: 100%; max-width: 440px; max-height: 100%; overflow: auto; background: var(--panel); border-radius: 22px; direction: rtl; animation: pop .25s ease-out; box-shadow: 0 10px 40px rgba(0,0,0,.4); overscroll-behavior: contain; }
@keyframes pop { from { transform: scale(.92); opacity: .3; } }
.oh { position: sticky; top: 0; z-index: 3; display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 10px 16px; background: linear-gradient(var(--wood2), var(--wood)); color: var(--white); border-radius: 22px 22px 0 0; }
.oh h3 { margin: 0; font: 400 25px var(--display); }
.oh .r { display: flex; gap: 6px; align-items: center; }
.oh button { border: 0; background: rgba(255,255,255,.2); color: var(--white); border-radius: 10px; padding: 6px 12px; font: 900 14px var(--body); cursor: pointer; }
.ob { padding: 14px 16px 16px; display: flex; flex-direction: column; gap: 10px; }
.big { border: 0; border-radius: 16px; padding: 11px; font: 400 21px var(--display); color: var(--white); background: linear-gradient(#4f9a3a, #3a7a29); box-shadow: 0 4px 0 var(--goodDk); cursor: pointer; flex: 1; }
.big.alt { background: linear-gradient(var(--amber), #c4841a); box-shadow: 0 4px 0 var(--amberDk); }
.big.gray { background: linear-gradient(#8a9480, #6c7563); box-shadow: 0 4px 0 #464d40; }
.big[disabled] { filter: grayscale(.9); opacity: .55; cursor: default; }
.btns { display: flex; gap: 8px; }
.note { color: var(--ink2); font-size: 13px; text-align: center; margin: 0; line-height: 1.6; }
.sec { font: 400 19px var(--display); color: var(--wood); margin: 4px 0 -2px; }
.tabs { display: flex; gap: 6px; background: rgba(0,0,0,.06); padding: 4px; border-radius: 14px; }
.tabs button { flex: 1; border: 0; border-radius: 11px; padding: 8px 4px; font: 900 14px var(--body); background: transparent; color: var(--ink2); cursor: pointer; }
.tabs button.on { background: var(--card); color: var(--ink); box-shadow: 0 2px 6px rgba(0,0,0,.12); }
.grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 8px; display: flex; flex-direction: column; align-items: center; gap: 3px; text-align: center; position: relative; }
.card .th { width: 100%; height: 66px; object-fit: contain; background: radial-gradient(ellipse at 50% 80%, #dcebc6, #f4f9ec 70%); border-radius: 11px; }
.card b { font-size: 15px; } .card small { color: var(--ink2); font-size: 12px; line-height: 1.45; display: flex; align-items: center; gap: 3px; justify-content: center; flex-wrap: wrap; }
.card small img { width: 18px; height: 18px; }
.card .own { position: absolute; top: 6px; right: 6px; background: var(--good); color: var(--white); font-size: 11px; font-weight: 900; border-radius: 8px; padding: 1px 6px; }
.card.lock { opacity: .55; }
.card .own.need { background: var(--bad); right: 50%; transform: translateX(50%); white-space: nowrap; }

function applySkin() { buildBG(); if (G) G.water = Math.min(G.water, wellCap()); }

box.addEventListener('click', e => {
  const b = e.target.closest('[data-act]'); if (!b || b.disabled) return; ac(); const a = b.dataset.act, d = b.dataset; if (a !== 'ld' && a !== 'ct') SFX.ui();

  else if (a === 'tab') openShop(d.t);
  else if (a === 'sell') openSell();
  else if (a === 'imp') openImport();

    if (d.d === 'all') G.load[k] = cur + Math.max(0, Math.min(room, (G.bag[k] || 0) - cur)); else if (d.d === '1') { if (room > 0 && cur < (G.bag[k] || 0)) G.load[k] = cur + 1; else SFX.err(); } else G.load[k] = Math.max(0, cur - 1);
    tone('sine', 700, 900, .04, .04); openSellKeep(); }

  else if (a === 'fly') { let val = 0; for (const k in G.load) { const n = Math.min(G.load[k], G.bag[k] || 0); G.bag[k] -= n; val += n * price(k); } G.load = {}; if (!val) return; G.sp = { st: 'to', t: 0, val }; if (isCar()) SFX.horn(); SFX.engine(true); closeOv(); toast(isCar() ? 'السيارة طلعت للمدينة 🚚' : 'الطيارة طارت للمدينة ✈️'); }

/* ---------- الحجم والحلقة ---------- */
function fit() {
  const st = $('stage'), cs = getComputedStyle(st), w = st.clientWidth - (parseFloat(cs.paddingLeft) || 0) - (parseFloat(cs.paddingRight) || 0), h = st.clientHeight - (parseFloat(cs.paddingTop) || 0) - (parseFloat(cs.paddingBottom) || 0);
  if (w < 40 || h < 40) return;
  const oF = { ...F }, oW = W, oH = H; layout(w / h); if (G && (oW !== W || oH !== H || oF.x1 !== F.x1 || oF.y1 !== F.y1)) remap(oF, oW, oH);
  const s = Math.min(w / W, h / H); cv.style.width = W * s + 'px'; cv.style.height = H * s + 'px';

let rz = 0; const refit = () => { clearTimeout(rz); rz = setTimeout(fit, 120); }; window.addEventListener('resize', refit); window.addEventListener('orientationchange', refit); try { new ResizeObserver(refit).observe($('stage')); } catch (e) {}
